<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>운동기록</title>
<style>
/* 밝은 화면(기본) */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --line:#e3e6ec;
  --text:#171b21; --muted:#727a85; --onAccent:#ffffff;
  --primary:#1b2430; --onPrimary:#ffffff;
  --glass:rgba(245,246,248,.92);
  --shadow:0 1px 2px rgba(20,26,34,.04);
  --weight:#8c5a2b; --cardio:#2a6b5d; --diet:#5b4b8a; --home:#2e4e9e; --body:#a8423c;
  --muscle:#d93a2b; --accent:var(--weight);
}
/* 종이 */
html[data-theme="paper"]{
  --bg:#f4efe6; --surface:#fffdf8; --surface2:#ece4d6; --line:#e4dbcc;
  --text:#2b2620; --muted:#7b7264; --onAccent:#ffffff;
  --primary:#3b332a; --onPrimary:#fdfaf4;
  --glass:rgba(244,239,230,.92);
  --shadow:0 1px 2px rgba(60,50,35,.05);
  --weight:#8a5a24; --cardio:#3f6b4a; --diet:#6b4a7a; --home:#3b5580; --body:#a8483c;
  --muscle:#d93a2b;
}
/* 남색 */
html[data-theme="slate"]{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e3e9f2; --line:#dae1ee;
  --text:#141c28; --muted:#6b7688; --onAccent:#ffffff;
  --primary:#1d2a44; --onPrimary:#ffffff;
  --glass:rgba(238,241,246,.92);
  --shadow:0 1px 2px rgba(20,28,40,.05);
  --weight:#8a5a2a; --cardio:#276b70; --diet:#4f4a8f; --home:#2b4c96; --body:#a4423f;
  --muscle:#d93a2b;
}
/* 한밤 */
html[data-theme="midnight"]{
  --bg:#0f1420; --surface:#18202f; --surface2:#202a3c; --line:#2a3448;
  --text:#e6ebf3; --muted:#8794a8; --onAccent:#0f1420;
  --primary:#e6ebf3; --onPrimary:#0f1420;
  --glass:rgba(15,20,32,.94);
  --shadow:none;
  --weight:#e5a866; --cardio:#5fc0ad; --diet:#b39bf0; --home:#8fabf7; --body:#e88079;
  --muscle:#f2564a;
}
/* 어두운 화면 */
html[data-theme="dark"]{
  --bg:#14181d; --surface:#1e242b; --surface2:#262e37; --line:#2f3843;
  --text:#e8edf2; --muted:#8a96a3; --onAccent:#14181d;
  --primary:#e8edf2; --onPrimary:#14181d;
  --glass:rgba(20,24,29,.94);
  --shadow:none;
  --weight:#f2a03d; --cardio:#4fb8a0; --diet:#c39bf0; --home:#7e9bf5; --body:#e0736e;
  --muscle:#f2564a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{cursor:pointer;border:none;background:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.2px}

header{
  position:sticky;top:0;z-index:20;background:var(--glass);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:8px;
}
.dnav{width:40px;height:40px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted)}
.dnav:active{background:var(--surface2)}
.dwrap{flex:1;text-align:center;position:relative}
.dwrap .big{font-size:19px;font-weight:700;letter-spacing:-.4px}
.dwrap .sub{font-size:12px;color:var(--muted);margin-top:1px}
.dwrap input{position:absolute;inset:0;opacity:0;padding:0;border:none}
#todayBtn{font-size:13px;color:var(--muted);padding:9px 11px;border-radius:9px;
  background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
#todayBtn.on{color:var(--onPrimary);background:var(--primary);font-weight:600;box-shadow:none}

main{padding:14px 12px 20px;max-width:620px;margin:0 auto}
.hide{display:none!important}

h2{font-size:15px;font-weight:600;color:var(--muted);margin:22px 0 9px;letter-spacing:-.2px}
h2:first-child{margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 14px;
  border:1px dashed var(--line);border-radius:14px;line-height:1.6}

.btn{background:var(--primary);color:var(--onPrimary);font-weight:600;border-radius:12px;
  padding:14px;width:100%;font-size:15px;letter-spacing:-.2px}
.btn:active{opacity:.82}
.btn.ghost{background:var(--surface);color:var(--text);font-weight:600;
  border:1px solid var(--line);box-shadow:var(--shadow)}
.chip{padding:9px 14px;border-radius:20px;background:var(--surface);color:var(--muted);
  font-size:14px;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--primary);color:var(--onPrimary);font-weight:600;border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.exname{font-size:16px;font-weight:650;letter-spacing:-.3px}
.setline{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line)}
.setno{width:32px;height:32px;flex:0 0 auto;border-radius:9px;background:var(--surface2);
  color:var(--muted);font-size:13px;font-weight:700}
.setno:active{opacity:.6}
.setval{font-size:17px;font-weight:600;flex:1;text-align:left;padding:7px 4px;border-radius:9px}
.setval:active{background:var(--surface2)}
.del{color:var(--muted);font-size:20px;padding:0 6px;margin-left:auto}
.gbtn{flex:0 0 auto;height:36px;padding:0 13px;border-radius:10px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  color:var(--muted);white-space:nowrap;gap:3px}
.gbtn:active{opacity:.6}

/* 시작 선택 화면 */
#gate{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  display:flex;align-items:center}
.gwrap{width:100%;max-width:480px;margin:0 auto}
.glogo{width:46px;height:46px;margin:0 auto 12px;color:var(--accent)}
.glogo svg{width:100%;height:100%}
.gtitle{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.6px}
.gsub{font-size:14px;color:var(--muted);text-align:center;line-height:1.7;margin:8px 0 26px}
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;
  padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.gcard:active{border-color:var(--accent)}
.gcard .gh{font-size:19px;font-weight:800;color:var(--accent);margin-bottom:5px}
.gcard .gd{font-size:14px;color:var(--muted);line-height:1.65}
.vidwrap{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#000}
.vidwrap video{width:100%;display:block;max-height:46vh}

/* 휴식 타이머 막대 */
#restBar{position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));
  z-index:45;background:var(--primary);color:var(--onPrimary);border-radius:14px;
  padding:9px 10px 9px 16px;display:flex;align-items:center;gap:6px;max-width:600px;
  margin:0 auto;box-shadow:0 4px 18px rgba(10,14,20,.22)}
#restBar .t{flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px}
#restBar button{color:var(--onPrimary);background:rgba(127,140,158,.28);border-radius:9px;
  padding:8px 10px;font-size:13px;font-weight:700}

/* 전체화면 카운터 */
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.ovtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ovtop .ttl{flex:1;font-size:16px;font-weight:700}
.ovtop button{color:var(--muted);font-size:15px;padding:8px 10px}
.ovtap{flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--surface);border-radius:18px;margin-bottom:12px;
  user-select:none;box-shadow:var(--shadow);text-align:center;padding:10px}
.ovtap{border:1px solid var(--line)}
.ovtap:active{background:var(--surface2)}
.bignum{font-size:80px;font-weight:800;line-height:1;letter-spacing:-3px;color:var(--accent)}
@media (max-height:680px){ .bignum{font-size:60px} .ovtap{min-height:120px} }
.ovhint{color:var(--muted);font-size:14px;margin-top:14px}
.ovbtm{display:flex;gap:8px}
.ovbtm .btn{padding:15px}
.tip{font-size:14.5px;line-height:1.75;color:var(--text);background:var(--surface2);
  border-radius:12px;padding:13px 14px;margin-bottom:12px}
.tip b{color:var(--accent);font-weight:700}
.prog{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:9px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.prog i.full{background:var(--cardio)}
.volume{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.prev{font-size:12.5px;color:var(--muted);margin-top:3px}

.check{display:flex;align-items:center;gap:12px;padding:14px 15px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.check.done .box{background:var(--primary);border-color:var(--primary);color:var(--onPrimary)}
.check.done .grow{color:var(--muted);text-decoration:line-through}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:rgba(10,14,20,.42)}
.sheet{overflow:hidden}
.sheet>div{background:var(--surface);width:100%;max-width:620px;margin:0 auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(10,14,20,.16);
  max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
.sheet h3{margin:0 0 14px;font-size:17px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 1px 11px;color:var(--muted);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:-.2px}
nav button svg{width:23px;height:23px;display:block}
nav button.on{color:var(--accent);font-weight:700}

.chart{width:100%;height:150px;display:block}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.7px}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:1px}

.an{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:4px 15px;margin-top:12px;box-shadow:var(--shadow)}
.an .r{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.an .r:first-child{border-top:none}
.an .r b{font-weight:700;text-align:right}
.an .h{font-size:13px;color:var(--muted);padding:13px 0 3px;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:var(--surface2);color:var(--accent);margin-left:6px}
.logday{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;margin-bottom:8px;box-shadow:var(--shadow)}
.logday .d{font-weight:700;font-size:15px;margin-bottom:5px}
.logday .l{font-size:13.5px;color:var(--muted);padding:2px 0}

#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);
  background:#1a2027;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
  font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:90;white-space:nowrap;
  box-shadow:0 4px 18px rgba(10,14,20,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#sync{font-size:11px;color:var(--muted);text-align:center;padding:16px 0 4px}
</style>
</head>
<body>

<header>
  <button class="dnav" id="prevD">‹</button>
  <div class="dwrap">
    <div class="big" id="dLabel">—</div>
    <div class="sub" id="dSub"></div>
    <input type="date" id="dPick">
  </div>
  <button class="dnav" id="nextD">›</button>
  <button id="todayBtn">오늘</button>
</header>

<main>
  <!-- 웨이트 -->
  <section id="v-weight">
    <div class="chips" id="modeRow" style="margin-bottom:12px"></div>
    <div class="chips" id="exChips"></div>
    <div id="exList"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn ghost" id="descBtn">운동 설명</button>
      <button class="btn ghost" id="addExBtn">종목 추가</button>
    </div>
    <div class="volume" id="volTotal" style="text-align:center;border:none;margin-top:14px"></div>
  </section>

  <!-- 유산소 -->
  <section id="v-cardio" class="hide">
    <div id="stepBox"></div>
    <div id="cardioList"></div>
    <button class="btn" id="addCardioBtn">유산소 기록</button>
  </section>

  <!-- 식단 -->
  <section id="v-diet" class="hide">
    <div class="stat">
      <div><div class="v num" id="dIn">0</div><div class="l">먹은 kcal</div></div>
      <div><div class="v num" id="dGoal">—</div><div class="l">목표 kcal</div></div>
      <div><div class="v num" id="dLeft">—</div><div class="l">남은 kcal</div></div>
    </div>
    <div class="chips" id="favChips"></div>
    <div id="foodList"></div>
    <button class="btn" id="addFoodBtn">먹은 것 기록</button>
    <div id="dietNote"></div>
  </section>

  <!-- 홈트 -->
  <section id="v-home" class="hide">
    <div class="stat">
      <div><div class="v num" id="hDone">0/0</div><div class="l">오늘 완료</div></div>
      <div><div class="v num" id="hStreak">0일</div><div class="l">연속 달성</div></div>
    </div>
    <div id="routineList"></div>
    <button class="btn ghost" id="editRoutineBtn">루틴 편집</button>
  </section>

  <!-- 체중 -->
  <section id="v-body" class="hide">
    <div id="profBox"></div>
    <div class="stat">
      <div><div class="v num" id="bW">—</div><div class="l">체중 kg</div></div>
      <div><div class="v num" id="bF">—</div><div class="l">체지방 %</div></div>
      <div><div class="v num" id="bM">—</div><div class="l">골격근 kg</div></div>
    </div>
    <div class="card">
      <div class="small muted" style="margin-bottom:8px">체중 변화 (최근 기록)</div>
      <svg class="chart" id="wChart"></svg>
      <div class="row small muted" style="justify-content:space-between;margin-top:4px">
        <span id="chartFrom"></span><span id="chartTo"></span>
      </div>
    </div>
    <button class="btn" id="addBodyBtn">오늘 몸 상태 기록</button>
    <div id="analysis"></div>
  </section>

  <!-- 기록 -->
  <section id="v-log" class="hide">
    <div class="stat">
      <div><div class="v num" id="lDays">0</div><div class="l">이번 달 운동일</div></div>
      <div><div class="v num" id="lVol">0</div><div class="l">이번 달 볼륨 t</div></div>
    </div>
    <h2>종목별 변화</h2>
    <div class="chips" id="exGChips"></div>
    <div id="exGBox"></div>

    <h2>최근 기록</h2>
    <div id="logList"></div>
    <button class="btn ghost" id="restBtn" style="margin-top:8px"></button>
    <button class="btn ghost" id="voiceBtn" style="margin-top:8px">카운터 목소리 고르기</button>
    <div class="small muted" style="margin:20px 0 8px">화면 스타일</div>
    <div class="chips" id="themeRow"></div>
    <div id="sync"></div>
  </section>
</main>

<nav>
  <button data-v="weight" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10"/></svg>웨이트</button>
  <button data-v="cardio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3.5l2.2-5.5L12.5 17l2-5h6.5"/></svg>유산소</button>
  <button data-v="diet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17v.5a8.5 8.5 0 0 1-17 0z"/><path d="M9 7.6c0-1.3 1-1.3 1-2.6M14 7.6c0-1.3 1-1.3 1-2.6"/></svg>식단</button>
  <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.2 12.3l2.7 2.7 5.1-5.6"/></svg>홈트</button>
  <button data-v="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.2 10.6a5 5 0 0 1 7.6 0"/><path d="M12 10.9l-1.7 2.6"/></svg>몸</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.2" width="17" height="15.3" rx="3.5"/><path d="M8 3.2v4M16 3.2v4M3.5 10.2h17"/></svg>기록</button>
</nav>

<div id="gate" class="hide">
  <div class="gwrap">
    <div class="glogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10"/></svg></div>
    <div class="gtitle">운동기록</div>
    <div class="gsub">어느 쪽으로 시작하시겠어요?<br>나중에 언제든 바꿀 수 있습니다</div>
    <button class="gcard" data-m="basic">
      <div class="gh">초급</div>
      <div class="gd">기본 종목 11가지와 자세 설명 위주입니다. 처음 시작하거나 오랜만에 다시 하시는 분께 맞습니다.</div>
    </button>
    <button class="gcard" data-m="mid">
      <div class="gh">중급</div>
      <div class="gd">데드리프트·턱걸이 등 종목이 늘어나고, 직접 찍은 자세 영상을 종목마다 넣어 둘 수 있습니다. 영상은 이 폰에만 저장됩니다.</div>
    </button>
  </div>
</div>
<div id="restBar" class="hide"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   Firebase 설정 — minwon 앱의 firebaseConfig 값을 그대로 넣으세요.
   비워두면 앱 첫 실행 때 붙여넣기 창이 뜹니다(그 값은 폰에 저장됨).
   ══════════════════════════════════════════════════════════ */
var FIREBASE_CONFIG = null;
/* 예시:
var FIREBASE_CONFIG = {
  apiKey:"...", authDomain:"minwon-c29c2.firebaseapp.com",
  databaseURL:"https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"minwon-c29c2", storageBucket:"...", messagingSenderId:"...", appId:"..."
};
*/
var DB_ROOT = 'undong';   // minwon 데이터와 섞이지 않도록 별도 경로

/* ── 상태 ── */
var DEFAULT_EX = ['벤치프레스','랫풀다운','스쿼트','레그프레스','숄더프레스','바벨로우','레그컬','레그익스텐션','케이블 푸시다운','덤벨컬','플랭크'];
var DEFAULT_ROUTINE = ['스트레칭 5분','팔굽혀펴기 20회','스쿼트 30회','플랭크 1분','윗몸일으키기 30회'];
var D = { days:{}, exercises:DEFAULT_EX.slice(), routine:DEFAULT_ROUTINE.slice(), body:{}, vids:{}, profile:null, favs:{} };
var cur = todayKey(), view='weight', curEx=null, fb=null, online=false;

function todayKey(){ var d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10?'0'+n:''+n; }
function $(s){ return document.querySelector(s); }
function day(k){ if(!D.days[k]) D.days[k]={w:{},c:[],r:{},f:[],g:{}}; var o=D.days[k];
  o.w=o.w||{}; o.c=o.c||[]; o.r=o.r||{}; o.f=o.f||[]; o.g=o.g||{}; return o; }
function recSets(n){
  var d=descFor(n);
  if(d){ var m=String(d[2]).match(/(\d+)(?:~(\d+))?\s*세트/); if(m) return parseInt(m[1],10); }
  return 3;
}
function setGoal(n){
  var o=day(cur);
  if(o.g[n]) return o.g[n];
  var ks=Object.keys(D.days).filter(function(k){ return k<cur && D.days[k].g && D.days[k].g[n]; }).sort();
  if(ks.length) return D.days[ks[ks.length-1]].g[n];
  return recSets(n);
}
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on')},1500); }

/* ── 저장 ── */
function save(){
  try{ localStorage.setItem('undong_data', JSON.stringify(D)); }catch(e){}
  if(fb){ fb.ref(DB_ROOT).set(D).then(function(){ online=true; }).catch(function(){ online=false; }); }
}
function loadLocal(){
  try{ var s=localStorage.getItem('undong_data');
    if(s){ var o=JSON.parse(s);
      D.days=o.days||{}; D.body=o.body||{}; D.vids=o.vids||{}; D.profile=o.profile||null; D.favs=o.favs||{};
      D.exercises=(o.exercises&&o.exercises.length)?o.exercises:DEFAULT_EX.slice();
      D.routine=(o.routine&&o.routine.length)?o.routine:DEFAULT_ROUTINE.slice();
    }
  }catch(e){}
}
function initFirebase(){
  var cfg = FIREBASE_CONFIG;
  if(!cfg){ try{ var s=localStorage.getItem('undong_fbcfg'); if(s) cfg=JSON.parse(s); }catch(e){} }
  if(!cfg || !cfg.databaseURL){ askConfig(); return; }
  try{
    firebase.initializeApp(cfg);
    fb = firebase.database();
    fb.ref(DB_ROOT).once('value').then(function(sn){
      var o = sn.val();
      online = true;
      if(o){
        D.days=o.days||D.days; D.body=o.body||D.body; D.vids=o.vids||D.vids;
        if(o.profile) D.profile=o.profile;
        D.favs=o.favs||D.favs;
        if(o.exercises&&o.exercises.length) D.exercises=o.exercises;
        if(o.routine&&o.routine.length) D.routine=o.routine;
        try{ localStorage.setItem('undong_data',JSON.stringify(D)); }catch(e){}
        render();
      }else{ save(); }
      renderSync();
    }).catch(function(){ online=false; renderSync(); });
  }catch(e){ online=false; }
}
function askConfig(){
  sheet('Firebase 설정', '<div class="small muted" style="margin-bottom:10px;line-height:1.6">'+
    'minwon 앱 index.html 안의 <b>firebaseConfig = { ... }</b> 중괄호 부분을 그대로 복사해 붙여넣으세요. 한 번만 하면 됩니다.</div>'+
    '<textarea id="cfgIn" rows="7" style="width:100%;background:var(--surface2);border:1px solid var(--line);'+
    'border-radius:10px;padding:11px;color:var(--text);font-size:13px;font-family:monospace"'+
    ' placeholder="{ apiKey: &quot;...&quot;, databaseURL: &quot;https://...firebasedatabase.app&quot;, ... }"></textarea>',
    function(){
      var t=$('#cfgIn').value.trim();
      if(!t) return true;
      var cfg;
      try{ cfg = (new Function('return ('+t+')'))(); }
      catch(e){ toast('형식을 다시 확인해 주세요'); return false; }
      if(!cfg || !cfg.databaseURL){ toast('databaseURL 항목이 없습니다'); return false; }
      localStorage.setItem('undong_fbcfg', JSON.stringify(cfg));
      location.reload(); return true;
    }, '연결하기', '나중에');
}
var APP_VER='v33';
function renderSync(){
  $('#sync').innerHTML = (fb ? (online? 'Firebase 연결됨 · 자동 저장 중' : '오프라인 · 폰에 저장 중, 연결되면 동기화')
    : '<span style="cursor:pointer;text-decoration:underline">Firebase 미연결 — 연결 설정하기</span>')
    + '<br>운동기록 ' + APP_VER;
  var a=$('#sync').querySelector('span'); if(a) a.onclick=askConfig;
}

/* ── 시트 ── */
function sheet(title, html, onOk, okText, cancelText){
  var el=document.createElement('div'); el.className='sheet';
  el.innerHTML='<div><h3>'+title+'</h3>'+html+
    '<div class="row" style="margin-top:16px"><button class="btn ghost" id="_c">'+(cancelText||'취소')+'</button>'+
    '<button class="btn" id="_o">'+(okText||'저장')+'</button></div></div>';
  document.body.appendChild(el);
  el.querySelector('#_c').onclick=function(){ el.remove(); };
  el.onclick=function(e){ if(e.target===el) el.remove(); };
  el.querySelector('#_o').onclick=function(){ if(onOk()!==false) el.remove(); };
  var f=el.querySelector('input,textarea,select'); if(f) setTimeout(function(){f.focus()},80);
  return el;
}

/* ── 날짜 ── */
var WD=['일','월','화','수','목','금','토'];
function setDate(k){ cur=k; render(); }
function shiftDate(n){ var d=new Date(cur+'T12:00'); d.setDate(d.getDate()+n); setDate(ymd(d)); }
function renderHeader(){
  var d=new Date(cur+'T12:00');
  $('#dLabel').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';
  var t=cur===todayKey();
  $('#dSub').textContent = t?'오늘':d.getFullYear()+'년';
  $('#todayBtn').classList.toggle('on', t);
  $('#dPick').value=cur;
}

/* ══ 소리 / 진동 ══ */
var actx=null;
function beep(times){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    for(var i=0;i<(times||3);i++){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type='sine'; o.frequency.value=i===(times-1)?1100:850;
      var t=actx.currentTime+i*0.3;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
      o.start(t); o.stop(t+0.27);
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
}

/* ══ 휴식 타이머 ══ */
var REST=60, restEnd=0, restTm=null;
try{ var r=parseInt(localStorage.getItem('undong_rest'),10); if(!isNaN(r)) REST=r; }catch(e){}
if(REST>90) REST=90;
if(REST&&REST<30) REST=30;
function startRest(sec){
  if(!sec) return;
  restEnd=Date.now()+sec*1000;
  var b=$('#restBar');
  b.innerHTML='<span class="t num"></span><button data-r="-30">−30</button>'+
              '<button data-r="30">+30</button><button data-r="0">✕</button>';
  b.querySelectorAll('[data-r]').forEach(function(x){
    x.onclick=function(){
      var v=+x.dataset.r;
      if(!v){ stopRest(); return; }
      restEnd+=v*1000;
      if(restEnd<=Date.now()) stopRest(); else tickRest();
    };
  });
  b.classList.remove('hide');
  if(restTm) clearInterval(restTm);
  restTm=setInterval(tickRest,250); tickRest();
}
function stopRest(){ if(restTm) clearInterval(restTm); restTm=null; restEnd=0; $('#restBar').classList.add('hide'); }
function tickRest(){
  var left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){ stopRest(); beep(3); toast('휴식 끝 — 다음 세트'); return; }
  var t=$('#restBar').querySelector('.t');
  if(t) t.textContent='휴식 '+Math.floor(left/60)+':'+pad(left%60);
}

/* ══ 전체화면 카운터 (자동/수동) ══ */
var PACES=[500,1000,1500,2000,3000], PACE=1000, VOICE=true;
try{ var _p=parseInt(localStorage.getItem('undong_pace'),10); if(!isNaN(_p)) PACE=_p; }catch(e){}
try{ VOICE = localStorage.getItem('undong_voice')!=='0'; }catch(e){}

function tone(freq,dur,vol){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='sine'; o.frequency.value=freq;
    var t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.35,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.start(t); o.stop(t+(dur||0.12)+0.03);
  }catch(e){}
}
function vib(v){ try{ if(navigator.vibrate) navigator.vibrate(v); }catch(e){} }
var NUMK=['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열'];
function cycleInfo(n,goal){
  if(goal>10 && n>goal-10 && n<=goal){
    var i=n-(goal-10);
    return { w:NUMK[i-1], last:true, first:i===1 };
  }
  var j=((n-1)%10)+1;
  return { w:NUMK[j-1], last:false, first:j===1 };
}
var KOVS=[], VSTYLE='strong', VNAME=null;
try{ VSTYLE=localStorage.getItem('undong_vstyle')||'strong'; }catch(e){}
try{ VNAME=localStorage.getItem('undong_vname')||null; }catch(e){}
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
function loadVoices(){
  var vs=allVoices(); KOVS=[];
  for(var i=0;i<vs.length;i++){
    var lg=(vs[i].lang||'').toLowerCase().replace('_','-');
    if(lg.indexOf('ko')===0) KOVS.push(vs[i]);
  }
}
function curVoice(){
  var vs=allVoices();
  if(VNAME){ for(var i=0;i<vs.length;i++) if(vs[i].name===VNAME) return vs[i]; }
  if(!KOVS.length) loadVoices();
  return KOVS.length ? KOVS[0] : null;
}
function styleOf(u){
  if(VSTYLE==='strong'){ u.rate=1.0; u.pitch=0.6; }
  else if(VSTYLE==='high'){ u.rate=1.25; u.pitch=1.35; }
  else { u.rate=1.15; u.pitch=1.0; }
  u.volume=1; u.lang='ko-KR';
}
function sayWith(voice, text){
  if(!speechOK()) return;
  try{
    var ss=speechSynthesis; ss.cancel();
    setTimeout(function(){
      var u=new SpeechSynthesisUtterance(String(text));
      styleOf(u); if(voice) u.voice=voice;
      ss.speak(u);
    },60);
  }catch(e){}
}
function voicePicker(){
  loadVoices();
  var list = KOVS.length ? KOVS : allVoices();
  var rows='';
  if(!list.length){
    rows='<div class="small muted" style="padding:16px 2px;line-height:1.7">폰에 설치된 목소리를 찾지 못했습니다. 설정 → 일반 → 텍스트 음성 변환에서 한국어 음성을 설치해 주세요.</div>';
  }
  list.forEach(function(v,i){
    var on = (VNAME===v.name) || (!VNAME && i===0);
    rows+='<div class="row" style="padding:12px 2px;border-top:1px solid var(--line)">'+
      '<div class="grow"><div style="font-weight:600">'+esc(v.name)+(on?' <span class="badge">사용 중</span>':'')+'</div>'+
      '<div class="small muted">'+esc(v.lang)+'</div></div>'+
      '<button class="gbtn" data-pv="'+i+'">들어보기</button>'+
      '<button class="gbtn" data-pk="'+i+'">고르기</button></div>';
  });
  var stl=[['strong','힘있게'],['normal','보통'],['high','높게']].map(function(s){
    return '<button class="chip'+(VSTYLE===s[0]?' on':'')+'" data-st="'+s[0]+'">'+s[1]+'</button>';
  }).join('');
  var sh=sheet('목소리 고르기',
    '<div class="small muted" style="margin-bottom:6px">목소리 세기</div>'+
    '<div class="chips" style="margin-bottom:10px">'+stl+'</div>'+
    '<div class="small muted" style="margin-bottom:2px">들어보고 고르세요</div>'+
    '<div style="max-height:46vh;overflow:auto">'+rows+'</div>',
    function(){}, '닫기', '');
  sh.style.zIndex=110;
  sh.querySelector('#_c').style.display='none';
  sh.querySelectorAll('[data-st]').forEach(function(b){
    b.onclick=function(){
      VSTYLE=b.dataset.st; try{ localStorage.setItem('undong_vstyle',VSTYLE); }catch(e){}
      sh.querySelectorAll('[data-st]').forEach(function(x){ x.classList.toggle('on', x===b); });
      sayWith(curVoice(),'하나 둘 셋');
    };
  });
  sh.querySelectorAll('[data-pv]').forEach(function(b){
    b.onclick=function(){ sayWith(list[+b.dataset.pv], '하나 둘 셋'); };
  });
  sh.querySelectorAll('[data-pk]').forEach(function(b){
    b.onclick=function(){
      var v=list[+b.dataset.pk];
      VNAME=v.name; try{ localStorage.setItem('undong_vname',VNAME); }catch(e){}
      sayWith(v,'좋습니다'); toast(v.name+' 선택');
      sh.remove(); voicePicker();
    };
  });
}
try{
  if(window.speechSynthesis){
    loadVoices();
    speechSynthesis.onvoiceschanged=loadVoices;
  }
}catch(e){}
function speechOK(){ return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }
function primeSpeech(){
  if(!speechOK()) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance('​');
    u.volume=0.01; u.lang='ko-KR'; var pv=curVoice(); if(pv) u.voice=pv;
    speechSynthesis.speak(u);
  }catch(e){}
}
function say(t){
  if(!speechOK()) return;
  try{
    var ss=speechSynthesis;
    if(ss.paused) ss.resume();
    var go=function(){
      var u=new SpeechSynthesisUtterance(String(t));
      styleOf(u);
      var v=curVoice(); if(v) u.voice=v;
      ss.speak(u);
    };
    if(ss.speaking||ss.pending){ ss.cancel(); setTimeout(go,60); }
    else go();
  }catch(e){}
}

function counter(title, opts){
  opts = opts || {};
  var SETS = opts.sets>0 ? opts.sets : 1;
  var restSec = (opts.rest!=null) ? opts.rest : (REST||60);
  var setNo = 1, n = 0, run = false, iv = null, wl = null, phase = 'count', lastBeep = 0;

  var el=document.createElement('div'); el.className='overlay';
  el.innerHTML=
    '<div class="ovtop"><div class="ttl">'+esc(title)+'</div><button id="_x">닫기</button></div>'+
    '<div class="ovtap" id="_tap"><div class="bignum num" id="_n">0</div>'+
    '<div id="_w" style="font-size:28px;font-weight:700;margin-top:2px;min-height:36px">&nbsp;</div>'+
    '<div class="ovhint" id="_h">목표 횟수를 넣으면 그 수에서 멈춥니다</div></div>'+
    '<div class="small muted" style="margin-bottom:6px">세는 간격</div>'+
    '<div class="chips" id="_pace"></div>'+
    '<div class="chips" id="_vrow" style="margin-bottom:8px"></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<input type="number" inputmode="numeric" id="_g" class="grow" placeholder="목표 횟수 (선택)" value="'+(opts.goal||'')+'">'+
    '</div>'+
    '<div class="ovbtm"><button class="btn ghost" id="_z">0으로</button>'+
    '<button class="btn" id="_s">시작</button>'+
    '<button class="btn ghost" id="_ok">완료</button></div>';
  document.body.appendChild(el);
  if(VOICE) primeSpeech();

  var nEl=el.querySelector('#_n'), hEl=el.querySelector('#_h'),
      sEl=el.querySelector('#_s'), wEl=el.querySelector('#_w');

  function goalOf(){ return parseInt(el.querySelector('#_g').value,10)||0; }
  function draw(){ nEl.textContent = n; }
  function setLine(){
    return SETS>1 ? (setNo+'세트 / 전체 '+SETS+'세트 · ') : '';
  }
  function drawPace(){
    var w=el.querySelector('#_pace'); w.innerHTML='';
    PACES.forEach(function(ms){
      var b=document.createElement('button');
      b.className='chip'+(ms===PACE?' on':'');
      b.textContent=(ms/1000)+'초';
      b.onclick=function(){
        PACE=ms; try{ localStorage.setItem('undong_pace',ms); }catch(e){}
        drawPace();
        if(run && phase==='count'){ clearInterval(iv); iv=setInterval(step,PACE); }
      };
      w.appendChild(b);
    });
  }
  var STYLES=[['strong','힘있게'],['normal','보통'],['high','높게']];
  function testSay(){
    if(!VOICE || !speechOK()) return;
    primeSpeech(); setTimeout(function(){ say('하나'); },140);
  }
  function drawVoice(){
    var w=el.querySelector('#_vrow'); w.innerHTML='';
    function chip(txt,on,fn){
      var b=document.createElement('button');
      b.className='chip'+(on?' on':''); b.textContent=txt; b.onclick=fn;
      w.appendChild(b); return b;
    }
    if(!speechOK()){ chip('음성 안 됨',false,function(){ toast('이 브라우저는 음성을 지원하지 않습니다'); }); return; }
    chip(VOICE?'숫자 읽어줌':'숫자 안 읽음', VOICE, function(){
      VOICE=!VOICE; try{ localStorage.setItem('undong_voice', VOICE?'1':'0'); }catch(e){}
      drawVoice(); if(VOICE){ testSay(); toast('시험 발음'); }
    });
    STYLES.forEach(function(s){
      chip(s[1], VSTYLE===s[0], function(){
        VSTYLE=s[0]; try{ localStorage.setItem('undong_vstyle',s[0]); }catch(e){}
        drawVoice(); testSay();
      });
    });
    chip('목소리 고르기', false, voicePicker);
  }

  function step(){
    var g=goalOf();
    n++; nEl.textContent=n;
    var ci=cycleInfo(n,g);
    var mark = ci.first && ci.last;
    wEl.textContent=(mark?'마지막 · ':'')+ci.w;
    wEl.style.color = ci.last ? 'var(--body)' : 'var(--text)';
    if(VOICE) say((mark?'마지막, ':'')+ci.w);
    if(g && n>=g){ finishSet(g); return; }
    var st=(VSTYLE==='strong');
    tone(mark?(st?900:1150):(st?620:880), st?.12:.09, st?.42:.32);
    vib(mark?[60,50,60]:(st?34:22));
  }

  function finishSet(g){
    stopTick();
    tone(1250,.3,.45); setTimeout(function(){ tone(1250,.35,.45); },300);
    vib([220,110,260]);
    wEl.textContent='그만'; wEl.style.color='var(--body)';
    if(VOICE) setTimeout(function(){ say('그만'); },700);
    if(opts.onSet) opts.onSet(n, setNo);
    if(setNo>=SETS){
      hEl.textContent = SETS>1 ? ('전체 '+SETS+'세트 완료') : ('목표 '+g+'회 완료');
      sEl.textContent='시작';
      if(opts.onAll) setTimeout(function(){ close(); opts.onAll(); },2000);
      return;
    }
    if(!restSec){ nextSet(); return; }
    restPhase();
  }

  function restPhase(){
    phase='rest'; lastBeep=0;
    var end=Date.now()+restSec*1000;
    sEl.textContent='휴식 건너뛰기';
    hEl.textContent=setNo+'세트 끝 · 휴식 '+restSec+'초';
    wEl.textContent='휴식'; wEl.style.color='var(--muted)';
    if(iv) clearInterval(iv);
    iv=setInterval(function(){
      var left=Math.ceil((end-Date.now())/1000);
      if(left<=0){ clearInterval(iv); iv=null; nextSet(); return; }
      nEl.textContent=left;
      if(left<=3 && left!==lastBeep){ lastBeep=left; tone(700,.08,.3); vib(30); }
    },200);
    nEl.textContent=restSec;
  }

  function nextSet(){
    if(iv){ clearInterval(iv); iv=null; }
    setNo++; n=0; phase='count';
    nEl.textContent=0; wEl.innerHTML='&nbsp;'; wEl.style.color='var(--text)';
    hEl.textContent=setLine()+'곧 시작합니다';
    tone(1100,.16,.42); vib([90,60,90]);
    if(VOICE) say('다시 시작');
    setTimeout(function(){ run=false; go(); },1200);
  }

  function go(){
    if(run) return;
    if(VOICE) primeSpeech();
    phase='count'; run=true;
    tone(1100,.12,.35);
    if(iv) clearInterval(iv);
    iv=setInterval(step,PACE);
    sEl.textContent='정지';
    hEl.textContent = setLine() + (goalOf() ? ((PACE/1000)+'초마다 · '+goalOf()+'회에서 멈춤')
                                            : ((PACE/1000)+'초마다 · 하나부터 열까지'));
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(x){ wl=x; }).catch(function(){}); }catch(e){}
  }
  function stopTick(){
    run=false; if(iv){ clearInterval(iv); iv=null; }
    sEl.textContent='시작';
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  }
  function stop(){
    stopTick(); phase='count';
    hEl.textContent=setLine()+'화면을 눌러 직접 셀 수도 있습니다';
    try{ if(wl){ wl.release(); wl=null; } }catch(e){}
  }
  function close(){ stop(); el.remove(); }

  el.querySelector('#_tap').onclick=function(){ if(!run && phase==='count') step(); };
  sEl.onclick=function(){
    if(phase==='rest'){ if(iv){ clearInterval(iv); iv=null; } nextSet(); return; }
    if(run) stop(); else go();
  };
  el.querySelector('#_z').onclick=function(){ n=0; draw(); wEl.innerHTML='&nbsp;'; };
  el.querySelector('#_g').oninput=function(){ if(!run && phase==='count'){ n=0; draw(); wEl.innerHTML='&nbsp;'; } };
  el.querySelector('#_x').onclick=close;
  el.querySelector('#_ok').onclick=function(){
    stopTick();
    if(n>0 && phase==='count' && opts.onSet) opts.onSet(n, setNo);
    close();
    if(opts.onDone) opts.onDone(n);
  };

  drawPace(); drawVoice(); draw();
  if(SETS>1) hEl.textContent=setLine()+'시작을 누르세요';
}

/* ══ 전체화면 스톱워치 ══ */
function stopwatch(title, onDone){
  var t0=0, acc=0, run=false, iv=null;
  var el=document.createElement('div'); el.className='overlay';
  el.innerHTML='<div class="ovtop"><div class="ttl">'+esc(title)+'</div><button id="_x">닫기</button></div>'+
    '<div class="ovtap"><div class="bignum num" id="_n">0:00</div>'+
    '<div class="ovhint">시작을 누르면 시간이 올라갑니다</div></div>'+
    '<div class="ovbtm"><button class="btn ghost" id="_z">초기화</button>'+
    '<button class="btn" id="_s">시작</button>'+
    '<button class="btn ghost" id="_ok">완료</button></div>';
  document.body.appendChild(el);
  function ms(){ return acc + (run? Date.now()-t0 : 0); }
  function draw(){ var s=Math.floor(ms()/1000);
    el.querySelector('#_n').textContent=Math.floor(s/60)+':'+pad(s%60); }
  el.querySelector('#_s').onclick=function(){
    if(run){ acc=ms(); run=false; clearInterval(iv); this.textContent='계속'; }
    else{ t0=Date.now(); run=true; iv=setInterval(draw,200); this.textContent='정지'; }
    draw();
  };
  el.querySelector('#_z').onclick=function(){ acc=0; t0=Date.now(); draw(); };
  el.querySelector('#_x').onclick=function(){ clearInterval(iv); el.remove(); };
  el.querySelector('#_ok').onclick=function(){
    clearInterval(iv); var m=Math.round(ms()/60000); el.remove(); if(onDone) onDone(m, Math.round(ms()/1000));
  };
}

/* ══ 영상 저장 (이 폰에만 보관) ══ */
var VDB=null;
function vdb(cb){
  if(VDB) return cb(VDB);
  try{
    var rq=indexedDB.open('undong_vid',1);
    rq.onupgradeneeded=function(e){ e.target.result.createObjectStore('v'); };
    rq.onsuccess=function(e){ VDB=e.target.result; cb(VDB); };
    rq.onerror=function(){ cb(null); };
  }catch(e){ cb(null); }
}
function vidPut(name,blob,cb){
  vdb(function(db){
    if(!db) return cb(false);
    try{
      var tx=db.transaction('v','readwrite');
      tx.objectStore('v').put(blob,name);
      tx.oncomplete=function(){ cb(true); };
      tx.onerror=function(){ cb(false); };
    }catch(e){ cb(false); }
  });
}
function vidGet(name,cb){
  vdb(function(db){
    if(!db) return cb(null);
    try{
      var rq=db.transaction('v','readonly').objectStore('v').get(name);
      rq.onsuccess=function(){ cb(rq.result||null); };
      rq.onerror=function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function vidDel(name,cb){
  vdb(function(db){
    if(!db) return cb();
    try{
      var tx=db.transaction('v','readwrite');
      tx.objectStore('v')['delete'](name);
      tx.oncomplete=function(){ cb(); };
      tx.onerror=function(){ cb(); };
    }catch(e){ cb(); }
  });
}

function shrinkImage(file, cb){
  try{
    var url=URL.createObjectURL(file);
    var im=new Image();
    im.onload=function(){
      var MX=1000, w=im.width, hh=im.height;
      if(w>MX){ hh=Math.round(hh*MX/w); w=MX; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(im,0,0,w,hh);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ cb(b||file); }, 'image/jpeg', 0.85);
    };
    im.onerror=function(){ URL.revokeObjectURL(url); cb(file); };
    im.src=url;
  }catch(e){ cb(file); }
}

}

 '턱걸이':['등 · 이두','상체 당기는 힘을 보는 가장 확실한 지표입니다. 한 개도 안 되면 랫풀다운으로 힘을 먼저 기르세요.','최대 반복 3~5세트'],
 '딥스':['가슴 아래 · 삼두','자기 체중으로 미는 운동입니다. 상체를 앞으로 기울이면 가슴, 세우면 팔 뒤쪽에 더 들어갑니다.','8~12회 3세트'],
 '바벨컬':['팔 앞(이두)','덤벨컬보다 무거운 무게를 다룰 수 있습니다. 팔 두께를 키울 때 씁니다.','8~12회 3세트'],
 '사이드 레터럴 레이즈':['어깨 옆','어깨를 옆으로 넓어 보이게 만드는 운동입니다. 무겁게 하면 자세가 무너지니 가벼운 무게로 하세요.','12~15회 3세트'],
 '루마니안 데드리프트':['허벅지 뒤 · 엉덩이','무릎을 거의 편 채로 하는 데드리프트입니다. 허벅지 뒤쪽이 당기는 느낌이 나야 제대로 하는 겁니다.','8~12회 3세트'],
 '힙 쓰러스트':['엉덩이','엉덩이 근육만 집중해서 씁니다. 오래 앉아 있어 엉덩이 힘이 빠진 경우 허리 통증 예방에 좋습니다.','10~15회 3세트'],
 '벤치프레스':['가슴 · 삼두 · 어깨앞','상체로 미는 힘의 기본이 되는 운동입니다. 가슴 전체를 두껍게 만들고 팔 뒤쪽과 어깨 앞도 같이 쓰입니다. 처음이면 봉만 들고(약 20kg) 자세부터 익히세요.','8~12회 3~4세트'],
 '랫풀다운':['등 넓이 · 이두','턱걸이를 기계로 쉽게 하는 운동입니다. 등을 넓게 만들고, 하루 종일 앉아 있어 굽은 등을 펴는 데도 도움이 됩니다.','10~15회 3세트'],
 '스쿼트':['허벅지 앞 · 엉덩이 · 허리','하체 운동의 기본이자 사실상 전신 운동입니다. 몸에서 근육이 가장 큰 부위를 쓰기 때문에 칼로리 소모도 큽니다. 무릎이 안 좋으면 반만 앉았다 일어나셔도 효과가 있습니다.','8~12회 3~4세트'],
 '레그프레스':['허벅지 · 엉덩이','스쿼트와 쓰는 부위는 비슷한데 허리 부담이 훨씬 적습니다. 허리가 안 좋거나 스쿼트 자세가 아직 불안하면 이쪽부터 하세요.','10~15회 3세트'],
 '숄더프레스':['어깨 · 삼두','어깨 선을 만드는 운동입니다. 어깨 관절은 다치기 쉬우니 가벼운 무게로 시작해 천천히 올리세요.','10~12회 3세트'],
 '바벨로우':['등 두께 · 이두','랫풀다운이 등 넓이라면 이건 등 두께를 만듭니다. 허리를 곧게 유지하지 못하면 다치기 쉬우니 무게 욕심을 내지 마세요.','8~12회 3세트'],
 '레그컬':['허벅지 뒤','앞허벅지만 키우면 앞뒤 균형이 깨져 무릎에 부담이 갑니다. 뒤쪽도 같이 해주는 게 좋습니다.','12~15회 3세트'],
 '레그익스텐션':['허벅지 앞','무릎 주변 근육을 강화합니다. 하체 운동 마무리로 쓰기 좋습니다. 무릎이 아프면 각도를 줄이세요.','12~15회 3세트'],
 '케이블 푸시다운':['팔 뒤(삼두)','팔뚝 굵기의 3분의 2는 앞이 아니라 뒤쪽 근육입니다. 팔을 키우려면 이쪽이 더 중요합니다.','12~15회 3세트'],
 '덤벨컬':['팔 앞(이두)','알통을 만드는 운동입니다. 반동을 쓰면 효과가 크게 떨어지니 천천히 하세요.','12~15회 3세트'],
 '플랭크':['복부 · 허리(코어)','허리 통증 예방에 가장 효과적인 운동으로 꼽힙니다. 몸통을 버티는 힘을 길러 다른 운동의 자세도 좋아집니다.','30초~1분 3세트'],
 '팔굽혀펴기':['가슴 · 삼두 · 코어','기구 없이 상체 전체를 쓰는 운동입니다. 힘들면 무릎을 바닥에 대고 하셔도 충분히 효과가 있습니다.','10~20회 3세트'],
 '윗몸일으키기':['복부','배 앞쪽 근육을 씁니다. 허리가 아프시면 상체를 조금만 드는 크런치나 플랭크로 바꾸세요.','15~30회 3세트'],
 '스트레칭':['전신 유연성','운동 전에는 몸을 움직이며 푸는 동적 스트레칭, 운동 후에는 자세를 멈춰 늘리는 정적 스트레칭이 맞습니다.','5~10분'],
 '걷기':['유산소 · 하체','무릎 부담이 적어 매일 해도 됩니다. 나이가 있으실수록 가장 안전하면서 효과가 확실한 운동입니다.','하루 30~60분'],
 '달리기':['유산소 · 하체','같은 시간에 걷기보다 두 배 넘게 소모합니다. 다만 체중이 많이 나가면 무릎에 부담이 크니 걷기로 기초를 만든 뒤에 시작하세요.','20~40분'],
 '자전거':['유산소 · 허벅지','체중이 안장에 실려 무릎 부담이 적습니다. 무릎이 안 좋은 분께 권할 만합니다.','30~60분'],
 '등산':['유산소 · 하체 전체','오르막은 심폐와 하체를 같이 단련합니다. 다만 내려올 때 무릎에 체중의 서너 배가 실리니 천천히 내려오세요.','1~3시간'],
 '수영':['전신 유산소','관절에 거의 부담이 없어 허리나 무릎이 안 좋은 분께 좋습니다.','30~40분']
};
function descFor(name){
  if(DESC[name]) return DESC[name];
  var k=Object.keys(DESC).filter(function(t){ return name.indexOf(t)>=0; });
  return k.length ? DESC[k[0]] : null;
}
function tipsFor(name){
  if(TIPS[name]) return TIPS[name];
  var k = Object.keys(TIPS).filter(function(t){ return name.indexOf(t)>=0; });
  return k.length ? TIPS[k[0]] : null;
}
function guide(name){
  var t = tipsFor(name), html='', dc=descFor(name);
  if(MODE==='mid') html += '<div id="picBox"></div>';
  html += '<div id="poseWrap">'+poseBox(name)+'</div>';
  html += bodyMap(name);
  if(dc){
    html += '<div class="small" style="margin:-4px 0 10px"><span class="badge" style="margin:0">'+esc(dc[0])+'</span>'+
            '<span class="badge" style="margin-left:6px">권장 '+esc(dc[2])+'</span></div>'+
            '<div style="font-size:14.5px;line-height:1.75;margin-bottom:12px">'+esc(dc[1])+'</div>';
  }
  if(t) html += '<div class="tip">'+t.map(function(s,i){return '<b>'+(i+1)+'</b> '+esc(s);}).join('<br>')+'</div>';
  else html += '<div class="tip muted">이 종목은 따로 저장된 자세 요령이 없습니다.</div>';
  if(MODE==='mid') html = '<div id="vBox"></div>' + html;
  html += '<div class="row" style="margin-bottom:4px">'+
    '<button class="btn ghost" id="gCnt">횟수 세기</button>'+
    '<button class="btn ghost" id="gSw">시간 재기</button></div>';
  if(MODE==='mid'){
    html += '<div class="row" style="margin-top:10px">'+
      '<label class="btn ghost" for="pFile" style="display:block;text-align:center">그림 넣기</label>'+
      '<button class="btn ghost" id="pDel">그림 지우기</button></div>'+
      '<input type="file" id="pFile" accept="image/*" style="display:none">'+
      '<div class="row" style="margin-top:8px">'+
      '<label class="btn ghost" for="vFile" style="display:block;text-align:center">영상 넣기</label>'+
      '<button class="btn ghost" id="vDel">영상 지우기</button></div>'+
      '<input type="file" id="vFile" accept="video/*" style="display:none">'+
      '<div class="small muted" style="margin-top:10px;line-height:1.7">'+
      '그림이나 영상을 폰에서 골라 넣으면 위에 나옵니다. 그림을 넣으면 기본 자세 그림 대신 그 그림이 보입니다. '+
      '<b>이 폰에만 저장되고 인터넷에는 올라가지 않습니다.</b> 폰을 바꾸거나 브라우저 저장 공간을 지우면 사라집니다.</div>';
  }
  var vurl=null;
  var sh = sheet(name, html, function(){}, '닫기', '');
  sh.querySelector('#_c').style.display='none';
  sh.querySelector('#gCnt').onclick=function(){ counter(name, {}); };
  sh.querySelector('#gSw').onclick=function(){ stopwatch(name, null); };
  if(MODE==='mid'){
    var purl=null, pb=sh.querySelector('#picBox');
    var showPic=function(){
      vidGet('img:'+name,function(b){
        if(purl){ URL.revokeObjectURL(purl); purl=null; }
        var pw=sh.querySelector('#poseWrap');
        if(!b){ pb.innerHTML=''; if(pw) pw.style.display=''; return; }
        purl=URL.createObjectURL(b);
        pb.innerHTML='<div class="card" style="padding:8px"><img src="'+purl+'" style="width:100%;display:block;border-radius:10px"></div>';
        if(pw) pw.style.display='none';
      });
    };
    showPic();
    sh.querySelector('#pFile').onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      toast('그림 저장 중...');
      shrinkImage(f,function(b){
        vidPut('img:'+name,b,function(ok){
          if(ok){ toast('그림을 넣었습니다'); showPic(); } else toast('저장하지 못했습니다');
        });
      });
    };
    sh.querySelector('#pDel').onclick=function(){
      vidDel('img:'+name,function(){ toast('그림을 지웠습니다'); showPic(); });
    };
    var box=sh.querySelector('#vBox');
    var showVid=function(){
      vidGet(name,function(b){
        if(vurl){ URL.revokeObjectURL(vurl); vurl=null; }
        if(!b){ box.innerHTML=''; return; }
        vurl=URL.createObjectURL(b);
        box.innerHTML='<div class="vidwrap"><video src="'+vurl+'" controls playsinline preload="metadata"></video></div>';
      });
    };
    showVid();
    sh.querySelector('#vFile').onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      if(f.size>300*1024*1024){ toast('영상이 너무 큽니다'); return; }
      toast('저장하는 중...');
      vidPut(name,f,function(ok){
        if(ok){ toast('영상을 넣었습니다'); showVid(); }
        else toast('저장하지 못했습니다');
      });
    };
    sh.querySelector('#vDel').onclick=function(){
      vidDel(name,function(){ toast('영상을 지웠습니다'); showVid(); });
    };
    var oldC=sh.querySelector('#_o').onclick;
    sh.querySelector('#_o').onclick=function(){
      if(vurl) URL.revokeObjectURL(vurl);
      if(purl) URL.revokeObjectURL(purl);
      oldC();
    };
  }
}

/* ══ 웨이트 ══ */
function renderWeight(){
  var o=day(cur), ch=$('#exChips'), used=Object.keys(o.w);
  ch.innerHTML='';
  D.exercises.forEach(function(n){
    var b=document.createElement('button');
    b.className='chip'+(used.indexOf(n)>=0?' on':'');
    b.textContent=n;
    var held=false, tm=null;
    function hold(){ tm=setTimeout(function(){ held=true; guide(n); },480); }
    function rel(){ clearTimeout(tm); }
    b.addEventListener('touchstart',hold,{passive:true});
    b.addEventListener('touchend',rel); b.addEventListener('touchmove',rel);
    b.addEventListener('mousedown',hold); b.addEventListener('mouseup',rel);
    b.addEventListener('mouseleave',rel);
    b.onclick=function(){ if(held){ held=false; return; } addSet(n); };
    ch.appendChild(b);
  });
  var L=$('#exList'), tot=0;
  L.innerHTML='';
  if(!used.length){
    L.innerHTML='<div class="empty">위에서 종목을 눌러 오늘의 첫 세트를 기록하세요<br>'+
      '어떤 운동인지 궁금하면 아래 <b>운동 설명</b>을 누르세요</div>';
  }
  used.forEach(function(n){
    var sets=o.w[n]||[], vol=0;
    sets.forEach(function(s){ vol += (s.kg||0)*(s.rep||0); });
    tot+=vol;
    var c=document.createElement('div'); c.className='card';
    var h='<div class="row"><div class="grow" data-g="'+esc(n)+'" style="cursor:pointer">'+
      '<div class="exname">'+esc(n)+'</div>'+
      '<div class="prev">'+prevText(n)+' · 설명 보기 ›</div></div>'+
      '<button class="gbtn" data-gr="'+esc(n)+'">그래프</button>'+
      '<button class="gbtn" data-g="'+esc(n)+'">설명</button>'+
      '<button class="btn ghost" style="width:auto;padding:9px 14px" data-add="'+esc(n)+'">세트 추가</button></div>';
    sets.forEach(function(s,i){
      h+='<div class="setline"><button class="setno num" data-mv="'+esc(n)+'" data-i="'+i+'">'+(i+1)+'</button>'+
         '<button class="setval num" data-ed="'+esc(n)+'" data-i="'+i+'">'+s.kg+'<span class="small muted"> kg</span> × '+s.rep+'<span class="small muted"> 회</span></button>'+
         '<button class="del" data-d="'+esc(n)+'" data-i="'+i+'">×</button></div>';
    });
    var rm=0; sets.forEach(function(s){ var e=s.kg*(1+s.rep/30); if(e>rm) rm=e; });
    var gl=setGoal(n), pct=Math.min(100, Math.round(sets.length/gl*100));
    h+='<div class="prog"><i class="'+(sets.length>=gl?'full':'')+'" style="width:'+pct+'%"></i></div>'+
       '<div class="volume num">'+sets.length+' / '+gl+' 세트'+
       (sets.length>=gl?' · 목표 달성':'')+' · 볼륨 '+fmt(vol)+' kg'+
       (rm? ' · 추정 1RM '+rm.toFixed(0)+'kg':'')+'</div>'+
       '<div class="small muted" style="padding:2px 0 4px">번호를 누르면 순서 이동 · 기록을 누르면 수정</div>';
    c.innerHTML=h; L.appendChild(c);
  });
  L.querySelectorAll('[data-add]').forEach(function(b){ b.onclick=function(){ addSet(b.dataset.add); }; });
  L.querySelectorAll('[data-g]').forEach(function(b){ b.onclick=function(){ guide(b.dataset.g); }; });
  L.querySelectorAll('[data-gr]').forEach(function(b){ b.onclick=function(){
    EXSEL=b.dataset.gr;
    var nav=document.querySelector('nav button[data-v="log"]'); if(nav) nav.click();
  };});
  L.querySelectorAll('[data-ed]').forEach(function(b){ b.onclick=function(){ editSet(b.dataset.ed, +b.dataset.i); }; });
  L.querySelectorAll('[data-mv]').forEach(function(b){ b.onclick=function(){ moveSet(b.dataset.mv, +b.dataset.i); }; });
  L.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){
    var n=b.dataset.d; o.w[n].splice(+b.dataset.i,1);
    if(!o.w[n].length) delete o.w[n]; save(); renderWeight();
  };});
  $('#volTotal').textContent = tot? ('오늘 총 볼륨 '+fmt(tot)+' kg') : '';
}
function prevText(n){
  var ks=Object.keys(D.days).filter(function(k){ return k<cur && D.days[k].w && D.days[k].w[n] && D.days[k].w[n].length; }).sort();
  if(!ks.length) return '지난 기록 없음';
  var k=ks[ks.length-1], s=D.days[k].w[n];
  var mx=0; s.forEach(function(x){ if(x.kg>mx) mx=x.kg; });
  return k.slice(5).replace('-','/')+' · 최고 '+mx+'kg · '+s.length+'세트';
}
function editSet(n,i){
  var sets=day(cur).w[n]; if(!sets||!sets[i]) return;
  var s=sets[i];
  sheet(n+' — '+(i+1)+'세트 수정',
    '<div class="row"><div class="grow"><div class="small muted" style="margin-bottom:5px">중량 kg</div>'+
    '<input type="number" inputmode="decimal" id="eKg" value="'+s.kg+'"></div>'+
    '<div class="grow"><div class="small muted" style="margin-bottom:5px">횟수</div>'+
    '<input type="number" inputmode="numeric" id="eRep" value="'+s.rep+'"></div></div>',
    function(){
      var kg=parseFloat($('#eKg').value), rp=parseInt($('#eRep').value,10);
      if(isNaN(kg)||isNaN(rp)){ toast('중량과 횟수를 확인해 주세요'); return false; }
      s.kg=kg; s.rep=rp; save(); renderWeight(); toast('수정했습니다');
    });
}
function moveSet(n,i){
  var sets=day(cur).w[n]; if(!sets||!sets[i]) return;
  var s=sets[i];
  var sh=sheet((i+1)+'세트 순서 바꾸기',
    '<div class="card" style="margin-bottom:12px"><span class="num" style="font-size:17px;font-weight:700">'+
      s.kg+' kg × '+s.rep+' 회</span></div>'+
    '<div class="row"><button class="btn ghost" id="_up"'+(i===0?' disabled style="opacity:.4"':'')+'>▲ 위로</button>'+
    '<button class="btn ghost" id="_dn"'+(i===sets.length-1?' disabled style="opacity:.4"':'')+'>▼ 아래로</button></div>',
    function(){}, '닫기', '');
  sh.querySelector('#_c').style.display='none';
  function swap(a,b){ var t=sets[a]; sets[a]=sets[b]; sets[b]=t; save(); renderWeight(); sh.remove(); }
  sh.querySelector('#_up').onclick=function(){ if(i>0) swap(i,i-1); };
  sh.querySelector('#_dn').onclick=function(){ if(i<sets.length-1) swap(i,i+1); };
}
function addSet(n){
  var o=day(cur), sets=o.w[n]||[], last=sets[sets.length-1];
  if(!last){ var ks=Object.keys(D.days).filter(function(k){return k<cur&&D.days[k].w&&D.days[k].w[n];}).sort();
    if(ks.length){ var p=D.days[ks[ks.length-1]].w[n]; last=p[p.length-1]; } }
  var reps=0;

function calGoal(){
  var P=D.profile, w=weightOn(cur);
  if(!P||!w) return 0;
  var age=P.birth?(new Date().getFullYear()-P.birth):45;
  var bmr=10*w+6.25*P.height-5*age+(P.sex==='f'?-161:5);
  var tdee=bmr*(P.act||1.375), g=tdee;
  if(P.goal && P.goal < w-0.5) g=tdee-350;
  else if(P.goal && P.goal > w+0.5) g=tdee+300;
  var floor = P.sex==='f'?1200:1500;
  return Math.max(Math.round(g/10)*10, floor);
}

function streak(){
  if(!D.routine.length) return 0;
  var n=0, d=new Date(cur+'T12:00');
  for(var i=0;i<400;i++){
    var k=ymd(d), o=D.days[k];
    var c=0; if(o&&o.r) D.routine.forEach(function(x){ if(o.r[x]) c++; });
    if(c===D.routine.length) n++; else { if(i>0||k!==todayKey()) break; }
    d.setDate(d.getDate()-1);
  }
  return n;
}

var ACTS=[[1.2,'거의 안 움직임'],[1.375,'가벼운 활동 (주 1~3회)'],[1.55,'보통 활동 (주 3~5회)'],[1.725,'활발한 활동 (주 6~7회)']];

function weightOn(k){
  var ks=Object.keys(D.body).filter(function(x){ return x<=k; }).sort();
  if(ks.length) return D.body[ks[ks.length-1]].w;
  ks=Object.keys(D.body).sort();
  return ks.length ? D.body[ks[0]].w : 0;
}
function bmiLabel(v){
  if(v<18.5) return '저체중';
  if(v<23) return '정상';
  if(v<25) return '비만 전단계';
  if(v<30) return '1단계 비만';
  if(v<35) return '2단계 비만';
  return '3단계 비만';
}
function met(type,km,min){
  var sp = (km>0&&min>0) ? km/(min/60) : 0;
  if(type==='달리기'){ if(!sp) sp=9; return sp<8?8.3:sp<11?10:sp<13?11.8:14; }
  if(type==='걷기'){ if(!sp) sp=4.5; return sp<4?2.8:sp<5.5?3.5:sp<6.5?5:6.3; }
  if(type==='자전거'){ if(!sp) sp=16; return sp<16?4:sp<19?6.8:sp<22?8:10; }
  if(type==='등산') return 6.5;
  if(type==='수영') return 6.0;
  return 4.0;
}
function kcalOf(r,k){
  if(r.kcal) return r.kcal;
  var w=weightOn(k||cur); if(!w) return 0;
  return Math.round(met(r.type,r.km,r.min)*3.5*w/200*r.min);
}

  var acts=ACTS.map(function(a){ return '<option value="'+a[0]+'"'+(P.act==a[0]?' selected':'')+'>'+a[1]+'</option>'; }).join('');
  sheet('내 정보',
    '<div class="row"><div class="grow"><div class="small muted" style="margin-bottom:5px">성별</div>'+
    '<select id="pS"><option value="m"'+(P.sex!=='f'?' selected':'')+'>남</option>'+
    '<option value="f"'+(P.sex==='f'?' selected':'')+'>여</option></select></div>'+
    '<div class="grow"><div class="small muted" style="margin-bottom:5px">태어난 해</div>'+
    '<input type="number" inputmode="numeric" id="pB" placeholder="1970" value="'+(P.birth||'')+'"></div></div>'+
    '<div class="row" style="margin-top:11px"><div class="grow"><div class="small muted" style="margin-bottom:5px">키 cm</div>'+
    '<input type="number" inputmode="decimal" id="pH" value="'+(P.height||'')+'"></div>'+
    '<div class="grow"><div class="small muted" style="margin-bottom:5px">목표 체중 kg (선택)</div>'+
    '<input type="number" inputmode="decimal" id="pG" value="'+(P.goal||'')+'"></div></div>'+
    '<div style="margin-top:11px"><div class="small muted" style="margin-bottom:5px">평소 활동량</div>'+
    '<select id="pA">'+acts+'</select></div>',
    function(){
      var ht=parseFloat($('#pH').value);
      if(isNaN(ht)||ht<100||ht>250){ toast('키를 확인해 주세요'); return false; }

        height:ht, goal:parseFloat($('#pG').value)||0, act:parseFloat($('#pA').value)||1.375 };
      save(); renderBody(); toast('저장했습니다');
    });
}
function renderProfile(){

  if(!P){
    b.innerHTML='<div class="empty" style="margin-bottom:12px">키와 나이를 등록하면<br>BMI·표준체중·기초대사량이 계산됩니다</div>'+
      '<button class="btn" id="pBtn" style="margin-bottom:14px">내 정보 등록하기</button>';
  }else{

      '<button class="gbtn" id="pBtn">수정</button></div></div>';

function renderAnalysis(){
  var box=$('#analysis'), P=D.profile, w=weightOn(cur);
  if(!P){ box.innerHTML=''; return; }
  if(!w){ box.innerHTML='<div class="empty" style="margin-top:12px">체중을 한 번 기록하면<br>분석이 나옵니다</div>'; return; }
  var m=P.height/100, bmi=w/(m*m);
  var lo=(18.5*m*m), hi=(22.9*m*m);
  var age=P.birth? (new Date().getFullYear()-P.birth) : 45;
  var bmr = 10*w + 6.25*P.height - 5*age + (P.sex==='f'? -161 : 5);
  var tdee = bmr*(P.act||1.375);
  var b=D.body[cur]||{};
  var rows='<div class="h">몸 상태</div>'+
    '<div class="r"><span>체질량지수 BMI</span><b>'+bmi.toFixed(1)+'<span class="badge">'+bmiLabel(bmi)+'</span></b></div>'+
    '<div class="r"><span>키 기준 정상 체중</span><b class="num">'+lo.toFixed(1)+' ~ '+hi.toFixed(1)+' kg</b></div>';
  if(P.goal){
    var d=w-P.goal;
    rows+='<div class="r"><span>목표까지</span><b class="num">'+(Math.abs(d)<0.1?'도달':(d>0?d.toFixed(1)+' kg 감량':Math.abs(d).toFixed(1)+' kg 증량'))+'</b></div>';
  }
  if(b.m) rows+='<div class="r"><span>골격근량 비율</span><b class="num">'+(b.m/w*100).toFixed(1)+' %</b></div>';
  rows+='<div class="h">하루 칼로리 (추정)</div>'+
    '<div class="r"><span>기초대사량</span><b class="num">'+fmt(bmr)+' kcal</b></div>'+
    '<div class="r"><span>활동 포함 유지 칼로리</span><b class="num">'+fmt(tdee)+' kcal</b></div>';

  var mo=cur.slice(0,7), kc=0, cmin=0, vol=0, dcnt=0;
  Object.keys(D.days).forEach(function(k){
    if(k.slice(0,7)!==mo) return;
    var o=D.days[k], any=false;
    (o.c||[]).forEach(function(r){ kc+=kcalOf(r,k); cmin+=r.min; any=true; });
    Object.keys(o.w||{}).forEach(function(n){ (o.w[n]||[]).forEach(function(s){ vol+=(s.kg||0)*(s.rep||0); any=true; }); });
    if(Object.keys(o.r||{}).length) any=true;
    if(any) dcnt++;
  });
  rows+='<div class="h">이번 달 운동</div>'+
    '<div class="r"><span>운동한 날</span><b class="num">'+dcnt+' 일</b></div>'+
    '<div class="r"><span>유산소</span><b class="num">'+cmin+' 분 · 약 '+fmt(kc)+' kcal</b></div>'+
    '<div class="r"><span>웨이트 총 볼륨</span><b class="num">'+fmt(vol)+' kg</b></div>';
  if(vol>0) rows+='<div class="r"><span>체중 대비 볼륨</span><b class="num">'+(vol/w).toFixed(0)+' 배</b></div>';

  box.innerHTML='<div class="an">'+rows+'</div>'+
    '<div class="small muted" style="padding:10px 4px 0;line-height:1.6">칼로리와 BMI는 통계식으로 계산한 어림값입니다. 몸 상태 판단은 건강검진 결과를 기준으로 하세요.</div>';
}

function drawChart(){
  var ks=Object.keys(D.body).sort().slice(-30);
  var svg=$('#wChart'), W=320, H=150, P=20;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(ks.length<2){
    svg.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" style="fill:var(--muted)" font-size="12" text-anchor="middle">기록이 2개 이상 쌓이면 그래프가 나옵니다</text>';
    $('#chartFrom').textContent=''; $('#chartTo').textContent=''; return;
  }
  var vs=ks.map(function(k){return D.body[k].w;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mx-mn<1){ mn-=.5; mx+=.5; }
  var pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  var pts=vs.map(function(v,i){
    var x=P+(W-P*2)*(ks.length===1?.5:i/(ks.length-1));
    var y=P+(H-P*2)*(1-(v-mn)/(mx-mn));
    return [x,y];
  });
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(H-P)+' L'+line.split(' ').join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-P)+' Z';
  var lastP=pts[pts.length-1];
  svg.innerHTML=
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" style="stop-color:var(--body);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--body);stop-opacity:0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<polyline points="'+line+'" fill="none" style="stroke:var(--body)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lastP[0].toFixed(1)+'" cy="'+lastP[1].toFixed(1)+'" r="4" style="fill:var(--body)"/>'+
    '<text x="'+(lastP[0]-6).toFixed(1)+'" y="'+(lastP[1]-9).toFixed(1)+'" style="fill:var(--text)" font-size="12" font-weight="700" text-anchor="end">'+vs[vs.length-1]+'</text>';
  $('#chartFrom').textContent=ks[0].slice(5).replace('-','/');
  var diff=(vs[vs.length-1]-vs[0]).toFixed(1);
  $('#chartTo').textContent=(diff>0?'+':'')+diff+'kg';
}

/* ══ 종목별 그래프 ══ */
var EXSEL=null, EXMET='mx';
var METS=[['mx','최고 중량','kg'],['rm','추정 1RM','kg'],['vol','총 볼륨','kg'],['sets','세트 수','세트']];

function exHistory(n){
  var out=[];
  Object.keys(D.days).sort().forEach(function(k){
    var s=(D.days[k].w||{})[n];
    if(!s||!s.length) return;
    var mx=0, vol=0, rm=0;
    s.forEach(function(x){
      if(x.kg>mx) mx=x.kg;
      vol+=(x.kg||0)*(x.rep||0);
      var e=x.kg*(1+x.rep/30); if(e>rm) rm=e;
    });
    out.push({ k:k, mx:mx, vol:vol, rm:Math.round(rm), sets:s.length });
  });
  return out;
}
function lineChart(svg, vals){
  var W=320,H=150,P=24;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(vals.length<2){
    svg.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" style="fill:var(--muted)" font-size="12" text-anchor="middle">기록이 2회 이상 쌓이면 그래프가 나옵니다</text>';
    return;
  }
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx-mn<1){ mn-=1; mx+=1; }
  var pd=(mx-mn)*.18; mn-=pd; mx+=pd;
  var pts=vals.map(function(v,i){
    return [ P+(W-P*2)*i/(vals.length-1), P+(H-P*2)*(1-(v-mn)/(mx-mn)) ];
  });
  var line=pts.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(H-P)+' L'+line.split(' ').join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-P)+' Z';
  var dots=pts.map(function(q,i){
    return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.4)+'" style="fill:var(--accent)"/>';
  }).join('');
  var lp=pts[pts.length-1];
  svg.innerHTML=
    '<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" style="stop-color:var(--accent);stop-opacity:.20"/>'+
    '<stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#eg)"/>'+
    '<polyline points="'+line+'" fill="none" style="stroke:var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+
    '<text x="'+(lp[0]-6).toFixed(1)+'" y="'+(lp[1]-10).toFixed(1)+'" style="fill:var(--text)" font-size="12" font-weight="700" text-anchor="end">'+fmt(vals[vals.length-1])+'</text>';
}
function renderExGraph(){
  var names=[];
  Object.keys(D.days).forEach(function(k){
    Object.keys(D.days[k].w||{}).forEach(function(n){
      if((D.days[k].w[n]||[]).length && names.indexOf(n)<0) names.push(n);
    });
  });
  var ch=$('#exGChips'), box=$('#exGBox');
  ch.innerHTML='';
  if(!names.length){
    box.innerHTML='<div class="empty">웨이트 기록이 쌓이면<br>종목별로 변화를 볼 수 있습니다</div>';
    return;
  }
  if(names.indexOf(EXSEL)<0) EXSEL=names[0];
  names.forEach(function(n){
    var b=document.createElement('button');
    b.className='chip'+(n===EXSEL?' on':'');
    b.textContent=n;
    b.onclick=function(){ EXSEL=n; renderExGraph(); };
    ch.appendChild(b);
  });

  var hist=exHistory(EXSEL);
  var mets=METS.map(function(m){
    return '<button class="chip'+(m[0]===EXMET?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>';
  }).join('');
  var unit='kg'; METS.forEach(function(m){ if(m[0]===EXMET) unit=m[2]; });
  var vals=hist.map(function(x){ return x[EXMET]; });
  var first=vals[0], last=vals[vals.length-1];
  var diff=(vals.length>1)?(last-first):0;

  box.innerHTML='<div class="chips" style="margin-bottom:6px">'+mets+'</div>'+
    '<div class="card"><svg class="chart" id="exChart"></svg>'+
    '<div class="row small muted" style="justify-content:space-between;margin-top:2px">'+
      '<span>'+(hist.length?hist[0].k.slice(5).replace('-','/'):'')+'</span>'+
      '<span>'+(hist.length?hist[hist.length-1].k.slice(5).replace('-','/'):'')+'</span></div></div>'+
    '<div class="an"><div class="r"><span>운동한 날</span><b class="num">'+hist.length+' 일</b></div>'+
    '<div class="r"><span>처음 기록</span><b class="num">'+(hist.length?fmt(first)+' '+unit:'—')+'</b></div>'+
    '<div class="r"><span>최근 기록</span><b class="num">'+(hist.length?fmt(last)+' '+unit:'—')+'</b></div>'+
    '<div class="r"><span>그동안 변화</span><b class="num">'+(vals.length>1?((diff>0?'+':'')+fmt(diff)+' '+unit):'—')+'</b></div></div>';

  box.querySelectorAll('[data-m]').forEach(function(b){
    b.onclick=function(){ EXMET=b.dataset.m; renderExGraph(); };
  });
  lineChart(box.querySelector('#exChart'), vals);
}

/* ══ 기록 ══ */
function renderLog(){
  renderExGraph();
  var mo=cur.slice(0,7), days=0, vol=0;
  Object.keys(D.days).forEach(function(k){
    if(k.slice(0,7)!==mo) return;
    var o=D.days[k];
    if(summary(o).length) days++;
    Object.keys(o.w||{}).forEach(function(n){ (o.w[n]||[]).forEach(function(s){ vol+=(s.kg||0)*(s.rep||0); }); });
  });
  $('#lDays').textContent=days;
  $('#lVol').textContent=(vol/1000).toFixed(1);
  var L=$('#logList'); L.innerHTML='';
  var ks=Object.keys(D.days).sort().reverse().filter(function(k){ return summary(D.days[k]).length; }).slice(0,40);
  if(!ks.length){ L.innerHTML='<div class="empty">아직 기록이 없습니다</div>'; renderSync(); return; }
  ks.forEach(function(k){
    var d=new Date(k+'T12:00');
    var el=document.createElement('div'); el.className='logday';
    el.innerHTML='<div class="d">'+(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')</div>'+
      summary(D.days[k]).map(function(s){return '<div class="l">'+esc(s)+'</div>'}).join('')+
      (D.body[k]?'<div class="l num">체중 '+D.body[k].w+'kg</div>':'');
    el.onclick=function(){ setDate(k); };
    L.appendChild(el);
  });
  renderSync();
}
function summary(o){
  var out=[];
  var ws=Object.keys(o.w||{});
  if(ws.length){
    var v=0,st=0; ws.forEach(function(n){ (o.w[n]||[]).forEach(function(s){ v+=(s.kg||0)*(s.rep||0); st++; }); });
    out.push('웨이트 '+ws.length+'종목 '+st+'세트 · '+fmt(v)+'kg');
  }
  (o.c||[]).forEach(function(r){ out.push(r.type+' '+r.min+'분'+(r.km?' '+r.km+'km':'')); });
  if(o.steps) out.push('걸음 '+fmt(o.steps)+'보');
  var rd=Object.keys(o.r||{}).length;
  if(rd) out.push('홈트 '+rd+'개 완료');
  var fk=0; (o.f||[]).forEach(function(x){ fk+=x.k||0; });
  if(fk) out.push('식사 '+(o.f.length)+'건 · '+fmt(fk)+'kcal');
  return out;
}

/* ── 공통 ── */
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function render(){
  renderHeader();
  drawModeBtn();
  if(view==='weight') renderWeight();
  else if(view==='cardio') renderCardio();
  else if(view==='diet') renderDiet();
  else if(view==='home') renderHome();
  else if(view==='body') renderBody();
  else renderLog();
}

  $('#gate').classList.add('hide');
  render();
  if(!first) toast(m==='mid'?'중급으로 바꿨습니다':'초급으로 바꿨습니다');
}
function drawModeBtn(){

  [['basic','초급'],['mid','중급']].forEach(function(m){

var THEMES=[['light','밝게','#f5f6f8'],['paper','종이','#f4efe6'],['slate','남색','#eef1f6'],
            ['dark','어둡게','#14181d'],['midnight','한밤','#0f1420']];
function drawThemeRow(){
  var w=$('#themeRow'); if(!w) return;
  var now=document.documentElement.getAttribute('data-theme')||'light';
  w.innerHTML='';
  THEMES.forEach(function(t){
    var b=document.createElement('button');
    b.className='chip'+(t[0]===now?' on':'');
    b.textContent=t[1];
    b.onclick=function(){ applyTheme(t[0]); };
    w.appendChild(b);
  });
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('undong_theme', t); }catch(e){}
  var col='#f5f6f8';
  THEMES.forEach(function(x){ if(x[0]===t) col=x[2]; });
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', col);
  drawThemeRow();
}
var RESTS=[0,30,45,60,75,90];
function drawRestBtn(){
  $('#restBtn').textContent = '세트 사이 휴식 타이머 : ' + (REST? REST+'초' : '사용 안 함');
}
$('#voiceBtn').onclick=function(){ primeSpeech(); voicePicker(); };
$('#restBtn').onclick=function(){
  var i=RESTS.indexOf(REST); REST=RESTS[(i+1)%RESTS.length];
  try{ localStorage.setItem('undong_rest', REST); }catch(e){}
  if(!REST) stopRest();
  drawRestBtn();
};
drawRestBtn();
var savedTheme='light';
try{ savedTheme = localStorage.getItem('undong_theme') || 'light'; }catch(e){}
applyTheme(savedTheme);

loadLocal();
if(!MODE) $('#gate').classList.remove('hide');
drawModeBtn();
render();
initFirebase();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
