<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>운동기록</title>
<style>
/* 밝은 화면(기본) */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#e9edf3; --line:#d9e0ea;
  --text:#1a2027; --muted:#6b7684; --onAccent:#ffffff;
  --glass:rgba(244,246,249,.93);
  --shadow:0 1px 2px rgba(26,32,39,.05), 0 2px 10px rgba(26,32,39,.05);
  --weight:#a35c00; --cardio:#0b6e5c; --diet:#7a4bb5; --home:#3a55b8; --body:#c0433d;
  --accent:var(--weight);
}
/* 어두운 화면 */
html[data-theme="dark"]{
  --bg:#14181d; --surface:#1e242b; --surface2:#262e37; --line:#333d48;
  --text:#e8edf2; --muted:#8a96a3; --onAccent:#14181d;
  --glass:rgba(20,24,29,.94);
  --shadow:none;
  --weight:#f2a03d; --cardio:#4fb8a0; --diet:#c39bf0; --home:#7e9bf5; --body:#e0736e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{cursor:pointer;border:none;background:none}
.num{font-variant-numeric:tabular-nums}

header{
  position:sticky;top:0;z-index:20;background:var(--glass);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:8px;
}
.dnav{width:40px;height:40px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted)}
.dnav:active{background:var(--surface2)}
.dwrap{flex:1;text-align:center;position:relative}
.dwrap .big{font-size:19px;font-weight:700;letter-spacing:-.3px}
.dwrap .sub{font-size:12px;color:var(--muted);margin-top:1px}
.dwrap input{position:absolute;inset:0;opacity:0;padding:0;border:none}
#todayBtn{font-size:13px;color:var(--muted);padding:9px 11px;border-radius:9px;
  background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
#todayBtn.on{color:var(--onAccent);background:var(--accent);font-weight:700;box-shadow:none}

main{padding:14px 12px 20px;max-width:620px;margin:0 auto}
.hide{display:none!important}

h2{font-size:15px;font-weight:600;color:var(--muted);margin:22px 0 9px;letter-spacing:-.2px}
h2:first-child{margin-top:2px}

.card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 14px;
  border:1px dashed var(--line);border-radius:14px;line-height:1.6}

.btn{background:var(--accent);color:var(--onAccent);font-weight:700;border-radius:11px;padding:13px;width:100%;font-size:15px}
.btn:active{opacity:.82}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:600}
.chip{padding:9px 14px;border-radius:20px;background:var(--surface);color:var(--muted);
  font-size:14px;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--onAccent);font-weight:700;border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.exname{font-size:16px;font-weight:600}
.setline{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.setno{width:26px;color:var(--muted);font-size:13px}
.setval{font-size:17px;font-weight:600}
.del{color:var(--muted);font-size:20px;padding:0 6px;margin-left:auto}
.gbtn{flex:0 0 auto;height:38px;padding:0 12px;border-radius:11px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;
  color:var(--accent);white-space:nowrap;gap:3px}
.gbtn:active{opacity:.6}
.ytwrap{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;
  margin-bottom:12px;background:#000}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 휴식 타이머 막대 */
#restBar{position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));
  z-index:45;background:var(--accent);color:var(--onAccent);border-radius:14px;
  padding:9px 10px 9px 16px;display:flex;align-items:center;gap:6px;max-width:600px;
  margin:0 auto;box-shadow:0 4px 18px rgba(10,14,20,.22)}
#restBar .t{flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px}
#restBar button{color:var(--onAccent);background:rgba(255,255,255,.22);border-radius:9px;
  padding:8px 10px;font-size:13px;font-weight:700}

/* 전체화면 카운터 */
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.ovtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ovtop .ttl{flex:1;font-size:16px;font-weight:700}
.ovtop button{color:var(--muted);font-size:15px;padding:8px 10px}
.ovtap{flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--surface);border-radius:18px;margin-bottom:12px;
  user-select:none;box-shadow:var(--shadow);text-align:center;padding:10px}
.ovtap:active{background:var(--surface2)}
.bignum{font-size:80px;font-weight:800;line-height:1;letter-spacing:-3px;color:var(--accent)}
@media (max-height:680px){ .bignum{font-size:60px} .ovtap{min-height:120px} }
.ovhint{color:var(--muted);font-size:14px;margin-top:14px}
.ovbtm{display:flex;gap:8px}
.ovbtm .btn{padding:15px}
.tip{font-size:14.5px;line-height:1.75;color:var(--text);background:var(--surface2);
  border-radius:12px;padding:13px 14px;margin-bottom:12px}
.tip b{color:var(--accent);font-weight:700}
.vlink{display:block;text-align:center;background:var(--surface2);color:var(--text);
  border-radius:11px;padding:13px;margin-bottom:8px;text-decoration:none;font-weight:600;font-size:15px}
.vlink.main{background:#e02b20;color:#fff}
.volume{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.prev{font-size:12.5px;color:var(--muted);margin-top:3px}

.check{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.check.done .box{background:var(--home);border-color:var(--home);color:var(--onAccent)}
.check.done .grow{color:var(--muted);text-decoration:line-through}

.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:rgba(10,14,20,.42)}
.sheet>div{background:var(--surface);width:100%;max-width:620px;margin:0 auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(10,14,20,.16)}
.sheet h3{margin:0 0 14px;font-size:17px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 1px 10px;color:var(--muted);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}

.chart{width:100%;height:150px;display:block}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat>div{flex:1;background:var(--surface);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.stat .v{font-size:21px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:1px}

.an{background:var(--surface);border-radius:14px;padding:4px 14px;margin-top:12px;box-shadow:var(--shadow)}
.an .r{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.an .r:first-child{border-top:none}
.an .r b{font-weight:700;text-align:right}
.an .h{font-size:13px;color:var(--muted);padding:13px 0 3px;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700;
  background:var(--surface2);color:var(--accent);margin-left:6px}
.logday{background:var(--surface);border-radius:13px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.logday .d{font-weight:700;font-size:15px;margin-bottom:5px}
.logday .l{font-size:13.5px;color:var(--muted);padding:2px 0}

#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);
  background:#1a2027;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
  font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:90;white-space:nowrap;
  box-shadow:0 4px 18px rgba(10,14,20,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#sync{font-size:11px;color:var(--muted);text-align:center;padding:16px 0 4px}
</style>
</head>
<body>

<header>
  <button class="dnav" id="prevD">‹</button>
  <div class="dwrap">
    <div class="big" id="dLabel">—</div>
    <div class="sub" id="dSub"></div>
    <input type="date" id="dPick">
  </div>
  <button class="dnav" id="nextD">›</button>
  <button id="todayBtn">오늘</button>
</header>

<main>
  <!-- 웨이트 -->
  <section id="v-weight">
    <div class="chips" id="exChips"></div>
    <div id="exList"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn ghost" id="descBtn">📖 운동 설명</button>
      <button class="btn ghost" id="addExBtn">＋ 종목 추가</button>
    </div>
    <div class="volume" id="volTotal" style="text-align:center;border:none;margin-top:14px"></div>
  </section>

  <!-- 유산소 -->
  <section id="v-cardio" class="hide">
    <div id="stepBox"></div>
    <div id="cardioList"></div>
    <button class="btn" id="addCardioBtn">＋ 유산소 기록</button>
  </section>

  <!-- 식단 -->
  <section id="v-diet" class="hide">
    <div class="stat">
      <div><div class="v num" id="dIn">0</div><div class="l">먹은 kcal</div></div>
      <div><div class="v num" id="dGoal">—</div><div class="l">목표 kcal</div></div>
      <div><div class="v num" id="dLeft">—</div><div class="l">남은 kcal</div></div>
    </div>
    <div class="chips" id="favChips"></div>
    <div id="foodList"></div>
    <button class="btn" id="addFoodBtn">＋ 먹은 것 기록</button>
    <div id="dietNote"></div>
  </section>

  <!-- 홈트 -->
  <section id="v-home" class="hide">
    <div class="stat">
      <div><div class="v num" id="hDone">0/0</div><div class="l">오늘 완료</div></div>
      <div><div class="v num" id="hStreak">0일</div><div class="l">연속 달성</div></div>
    </div>
    <div id="routineList"></div>
    <button class="btn ghost" id="editRoutineBtn">루틴 편집</button>
  </section>

  <!-- 체중 -->
  <section id="v-body" class="hide">
    <div id="profBox"></div>
    <div class="stat">
      <div><div class="v num" id="bW">—</div><div class="l">체중 kg</div></div>
      <div><div class="v num" id="bF">—</div><div class="l">체지방 %</div></div>
      <div><div class="v num" id="bM">—</div><div class="l">골격근 kg</div></div>
    </div>
    <div class="card">
      <div class="small muted" style="margin-bottom:8px">체중 변화 (최근 기록)</div>
      <svg class="chart" id="wChart"></svg>
      <div class="row small muted" style="justify-content:space-between;margin-top:4px">
        <span id="chartFrom"></span><span id="chartTo"></span>
      </div>
    </div>
    <button class="btn" id="addBodyBtn">오늘 몸 상태 기록</button>
    <div id="analysis"></div>
  </section>

  <!-- 기록 -->
  <section id="v-log" class="hide">
    <div class="stat">
      <div><div class="v num" id="lDays">0</div><div class="l">이번 달 운동일</div></div>
      <div><div class="v num" id="lVol">0</div><div class="l">이번 달 볼륨 t</div></div>
    </div>
    <h2>최근 기록</h2>
    <div id="logList"></div>
    <button class="btn ghost" id="restBtn" style="margin-top:16px"></button>
    <button class="btn ghost" id="themeBtn" style="margin-top:8px"></button>
    <div id="sync"></div>
  </section>
</main>

<nav>
  <button data-v="weight" class="on"><span class="ic">🏋️</span>웨이트</button>
  <button data-v="cardio"><span class="ic">🏃</span>유산소</button>
  <button data-v="diet"><span class="ic">🍚</span>식단</button>
  <button data-v="home"><span class="ic">✅</span>홈트</button>
  <button data-v="body"><span class="ic">⚖️</span>몸</button>
  <button data-v="log"><span class="ic">📆</span>기록</button>
</nav>

<div id="restBar" class="hide"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   Firebase 설정 — minwon 앱의 firebaseConfig 값을 그대로 넣으세요.
   비워두면 앱 첫 실행 때 붙여넣기 창이 뜹니다(그 값은 폰에 저장됨).
   ══════════════════════════════════════════════════════════ */
var FIREBASE_CONFIG = null;
/* 예시:
var FIREBASE_CONFIG = {
  apiKey:"...", authDomain:"minwon-c29c2.firebaseapp.com",
  databaseURL:"https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"minwon-c29c2", storageBucket:"...", messagingSenderId:"...", appId:"..."
};
*/
var DB_ROOT = 'undong';   // minwon 데이터와 섞이지 않도록 별도 경로

/* ── 상태 ── */
var DEFAULT_EX = ['벤치프레스','랫풀다운','스쿼트','레그프레스','숄더프레스','바벨로우','레그컬','레그익스텐션','케이블 푸시다운','덤벨컬','플랭크'];
var DEFAULT_ROUTINE = ['스트레칭 5분','팔굽혀펴기 20회','스쿼트 30회','플랭크 1분','윗몸일으키기 30회'];
var D = { days:{}, exercises:DEFAULT_EX.slice(), routine:DEFAULT_ROUTINE.slice(), body:{}, vids:{}, profile:null, favs:{} };
var cur = todayKey(), view='weight', curEx=null, fb=null, online=false;

function todayKey(){ var d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10?'0'+n:''+n; }
function $(s){ return document.querySelector(s); }
function day(k){ if(!D.days[k]) D.days[k]={w:{},c:[],r:{},f:[]}; var o=D.days[k];
  o.w=o.w||{}; o.c=o.c||[]; o.r=o.r||{}; o.f=o.f||[]; return o; }
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on')},1500); }

/* ── 저장 ── */
function save(){
  try{ localStorage.setItem('undong_data', JSON.stringify(D)); }catch(e){}
  if(fb){ fb.ref(DB_ROOT).set(D).then(function(){ online=true; }).catch(function(){ online=false; }); }
}
function loadLocal(){
  try{ var s=localStorage.getItem('undong_data');
    if(s){ var o=JSON.parse(s);
      D.days=o.days||{}; D.body=o.body||{}; D.vids=o.vids||{}; D.profile=o.profile||null; D.favs=o.favs||{};
      D.exercises=(o.exercises&&o.exercises.length)?o.exercises:DEFAULT_EX.slice();
      D.routine=(o.routine&&o.routine.length)?o.routine:DEFAULT_ROUTINE.slice();
    }
  }catch(e){}
}
function initFirebase(){
  var cfg = FIREBASE_CONFIG;
  if(!cfg){ try{ var s=localStorage.getItem('undong_fbcfg'); if(s) cfg=JSON.parse(s); }catch(e){} }
  if(!cfg || !cfg.databaseURL){ askConfig(); return; }
  try{
    firebase.initializeApp(cfg);
    fb = firebase.database();
    fb.ref(DB_ROOT).once('value').then(function(sn){
      var o = sn.val();
      online = true;
      if(o){
        D.days=o.days||D.days; D.body=o.body||D.body; D.vids=o.vids||D.vids;
        if(o.profile) D.profile=o.profile;
        D.favs=o.favs||D.favs;
        if(o.exercises&&o.exercises.length) D.exercises=o.exercises;
        if(o.routine&&o.routine.length) D.routine=o.routine;
        try{ localStorage.setItem('undong_data',JSON.stringify(D)); }catch(e){}
        render();
      }else{ save(); }
      renderSync();
    }).catch(function(){ online=false; renderSync(); });
  }catch(e){ online=false; }
}
function askConfig(){
  sheet('Firebase 설정', '<div class="small muted" style="margin-bottom:10px;line-height:1.6">'+
    'minwon 앱 index.html 안의 <b>firebaseConfig = { ... }</b> 중괄호 부분을 그대로 복사해 붙여넣으세요. 한 번만 하면 됩니다.</div>'+
    '<textarea id="cfgIn" rows="7" style="width:100%;background:var(--surface2);border:1px solid var(--line);'+
    'border-radius:10px;padding:11px;color:var(--text);font-size:13px;font-family:monospace"'+
    ' placeholder="{ apiKey: &quot;...&quot;, databaseURL: &quot;https://...firebasedatabase.app&quot;, ... }"></textarea>',
    function(){
      var t=$('#cfgIn').value.trim();
      if(!t) return true;
      var cfg;
      try{ cfg = (new Function('return ('+t+')'))(); }
      catch(e){ toast('형식을 다시 확인해 주세요'); return false; }
      if(!cfg || !cfg.databaseURL){ toast('databaseURL 항목이 없습니다'); return false; }
      localStorage.setItem('undong_fbcfg', JSON.stringify(cfg));
      location.reload(); return true;
    }, '연결하기', '나중에');
}
var APP_VER='v9';
function renderSync(){
  $('#sync').innerHTML = (fb ? (online? 'Firebase 연결됨 · 자동 저장 중' : '오프라인 · 폰에 저장 중, 연결되면 동기화')
    : '<span style="cursor:pointer;text-decoration:underline">Firebase 미연결 — 연결 설정하기</span>')
    + '<br>운동기록 ' + APP_VER;
  var a=$('#sync').querySelector('span'); if(a) a.onclick=askConfig;
}

/* ── 시트 ── */
function sheet(title, html, onOk, okText, cancelText){
  var el=document.createElement('div'); el.className='sheet';
  el.innerHTML='<div><h3>'+title+'</h3>'+html+
    '<div class="row" style="margin-top:16px"><button class="btn ghost" id="_c">'+(cancelText||'취소')+'</button>'+
    '<button class="btn" id="_o">'+(okText||'저장')+'</button></div></div>';
  document.body.appendChild(el);
  el.querySelector('#_c').onclick=function(){ el.remove(); };
  el.onclick=function(e){ if(e.target===el) el.remove(); };
  el.querySelector('#_o').onclick=function(){ if(onOk()!==false) el.remove(); };

/* ══ 소리 / 진동 ══ */
var actx=null;
function beep(times){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    for(var i=0;i<(times||3);i++){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type='sine'; o.frequency.value=i===(times-1)?1100:850;
      var t=actx.currentTime+i*0.3;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
      o.start(t); o.stop(t+0.27);
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
}

/* ══ 휴식 타이머 ══ */
var REST=90, restEnd=0, restTm=null;
try{ var r=parseInt(localStorage.getItem('undong_rest'),10); if(!isNaN(r)) REST=r; }catch(e){}
function startRest(sec){
  if(!sec) return;
  restEnd=Date.now()+sec*1000;
  var b=$('#restBar');
  b.innerHTML='<span class="t num"></span><button data-r="-30">−30</button>'+
              '<button data-r="30">+30</button><button data-r="0">✕</button>';
  b.querySelectorAll('[data-r]').forEach(function(x){
    x.onclick=function(){
      var v=+x.dataset.r;
      if(!v){ stopRest(); return; }
      restEnd+=v*1000;
      if(restEnd<=Date.now()) stopRest(); else tickRest();
    };
  });
  b.classList.remove('hide');
  if(restTm) clearInterval(restTm);
  restTm=setInterval(tickRest,250); tickRest();
}
function stopRest(){ if(restTm) clearInterval(restTm); restTm=null; restEnd=0; $('#restBar').classList.add('hide'); }
function tickRest(){
  var left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){ stopRest(); beep(3); toast('휴식 끝 — 다음 세트'); return; }
  var t=$('#restBar').querySelector('.t');
  if(t) t.textContent='휴식 '+Math.floor(left/60)+':'+pad(left%60);
}

/* ══ 전체화면 카운터 (자동/수동) ══ */
var PACES=[500,1000,1500,2000,3000], PACE=1000, VOICE=true;
try{ var _p=parseInt(localStorage.getItem('undong_pace'),10); if(!isNaN(_p)) PACE=_p; }catch(e){}
try{ VOICE = localStorage.getItem('undong_voice')!=='0'; }catch(e){}

function tone(freq,dur,vol){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='sine'; o.frequency.value=freq;
    var t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.35,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.start(t); o.stop(t+(dur||0.12)+0.03);
  }catch(e){}
}
function vib(v){ try{ if(navigator.vibrate) navigator.vibrate(v); }catch(e){} }
function say(n){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(n));
    u.lang='ko-KR'; u.rate=1.3;
    speechSynthesis.speak(u);
  }catch(e){}
}

function counter(title, start, onDone){
  var n=start||0, run=false, iv=null, wl=null;
  var el=document.createElement('div'); el.className='overlay';
  el.innerHTML=
    '<div class="ovtop"><div class="ttl">'+esc(title)+'</div><button id="_x">닫기</button></div>'+
    '<div class="ovtap" id="_tap"><div class="bignum num" id="_n">'+n+'</div>'+
    '<div class="ovhint" id="_h">시작을 누르면 자동으로 셉니다</div></div>'+
    '<div class="small muted" style="margin-bottom:6px">세는 간격</div>'+
    '<div class="chips" id="_pace"></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<button class="chip" id="_v" style="padding:12px 14px">숫자 읽어주기</button>'+
      '<input type="number" inputmode="numeric" id="_g" placeholder="목표 횟수 (선택)" class="grow">'+
    '</div>'+
    '<div class="ovbtm"><button class="btn ghost" id="_z">0으로</button>'+
    '<button class="btn" id="_s">시작</button>'+
    '<button class="btn ghost" id="_ok">완료</button></div>';
  document.body.appendChild(el);

  var nEl=el.querySelector('#_n'), hEl=el.querySelector('#_h'), sEl=el.querySelector('#_s');

  function drawPace(){
    var w=el.querySelector('#_pace'); w.innerHTML='';
    PACES.forEach(function(ms){
      var b=document.createElement('button');
      b.className='chip'+(ms===PACE?' on':'');
      b.textContent=(ms/1000)+'초';
      b.onclick=function(){
        PACE=ms; try{ localStorage.setItem('undong_pace',ms); }catch(e){}
        drawPace();
        if(run){ clearInterval(iv); iv=setInterval(tick,PACE); hEl.textContent=(PACE/1000)+'초마다 셉니다'; }
      };
      w.appendChild(b);
    });
  }
  function drawVoice(){
    var b=el.querySelector('#_v');
    b.classList.toggle('on', VOICE);
    b.textContent = VOICE ? '숫자 읽어줌' : '숫자 안 읽음';
  }
  function tick(){
    n++; nEl.textContent=n;
    var goal=parseInt(el.querySelector('#_g').value,10)||0;
    if(goal && n>=goal){
      stop();
      tone(1250,.3,.45); setTimeout(function(){ tone(1250,.35,.45); },260);
      vib([200,110,260]); hEl.textContent='목표 '+goal+'회 완료';
      if(VOICE) setTimeout(function(){ say('완료'); },700);
      return;
    }
    tone(880,.09,.32); vib(22);
    if(VOICE) say(n);
  }
  function go(){
    if(run) return;
    run=true; tone(1100,.12,.35);
    iv=setInterval(tick,PACE);
    sEl.textContent='정지'; hEl.textContent=(PACE/1000)+'초마다 셉니다';
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(x){ wl=x; }).catch(function(){}); }catch(e){}
  }
  function stop(){
    run=false; if(iv) clearInterval(iv); iv=null;
    sEl.textContent='시작'; hEl.textContent='화면을 눌러 직접 셀 수도 있습니다';
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    try{ if(wl){ wl.release(); wl=null; } }catch(e){}
  }
  function close(){ stop(); el.remove(); }

  el.querySelector('#_tap').onclick=function(){
    if(run) return;
    n++; nEl.textContent=n; tone(880,.07,.25); vib(18); if(VOICE) say(n);
  };
  sEl.onclick=function(){ if(run) stop(); else go(); };
  el.querySelector('#_z').onclick=function(){ n=0; nEl.textContent=0; };
  el.querySelector('#_v').onclick=function(){
    VOICE=!VOICE; try{ localStorage.setItem('undong_voice', VOICE?'1':'0'); }catch(e){}
    drawVoice();
  };
  el.querySelector('#_x').onclick=close;
  el.querySelector('#_ok').onclick=function(){ stop(); el.remove(); if(onDone) onDone(n); };

  drawPace(); drawVoice();
}

/* ══ 전체화면 스톱워치 ══ */
function stopwatch(title, onDone){
  var t0=0, acc=0, run=false, iv=null;
  var el=document.createElement('div'); el.className='overlay';
  el.innerHTML='<div class="ovtop"><div class="ttl">'+esc(title)+'</div><button id="_x">닫기</button></div>'+
    '<div class="ovtap"><div class="bignum num" id="_n">0:00</div>'+
    '<div class="ovhint">시작을 누르면 시간이 올라갑니다</div></div>'+
    '<div class="ovbtm"><button class="btn ghost" id="_z">초기화</button>'+
    '<button class="btn" id="_s">시작</button>'+
    '<button class="btn ghost" id="_ok">완료</button></div>';
  document.body.appendChild(el);
  function ms(){ return acc + (run? Date.now()-t0 : 0); }
  function draw(){ var s=Math.floor(ms()/1000);
    el.querySelector('#_n').textContent=Math.floor(s/60)+':'+pad(s%60); }
  el.querySelector('#_s').onclick=function(){
    if(run){ acc=ms(); run=false; clearInterval(iv); this.textContent='계속'; }
    else{ t0=Date.now(); run=true; iv=setInterval(draw,200); this.textContent='정지'; }
    draw();
  };
  el.querySelector('#_z').onclick=function(){ acc=0; t0=Date.now(); draw(); };
  el.querySelector('#_x').onclick=function(){ clearInterval(iv); el.remove(); };
  el.querySelector('#_ok').onclick=function(){
    clearInterval(iv); var m=Math.round(ms()/60000); el.remove(); if(onDone) onDone(m, Math.round(ms()/1000));
  };
}

function descFor(name){
  if(DESC[name]) return DESC[name];
  var k=Object.keys(DESC).filter(function(t){ return name.indexOf(t)>=0; });
  return k.length ? DESC[k[0]] : null;
}
function tipsFor(name){
  if(TIPS[name]) return TIPS[name];
  var k = Object.keys(TIPS).filter(function(t){ return name.indexOf(t)>=0; });
  return k.length ? TIPS[k[0]] : null;
}
function guide(name){
  var t = tipsFor(name), saved = D.vids[name];
  var q = encodeURIComponent(name.replace(/\s*\d+[회분초]\s*/g,'').trim()+' 자세');
  var html='', dc=descFor(name);
  if(dc){
    html += '<div class="small" style="margin:-4px 0 10px"><span class="badge" style="margin:0">'+esc(dc[0])+'</span>'+
            '<span class="badge" style="margin-left:6px">권장 '+esc(dc[2])+'</span></div>'+
            '<div style="font-size:14.5px;line-height:1.75;margin-bottom:12px">'+esc(dc[1])+'</div>';
  }
  if(t) html += '<div class="tip">'+t.map(function(s,i){return '<b>'+(i+1)+'</b> '+esc(s);}).join('<br>')+'</div>';
  else html += '<div class="tip muted">저장된 요령이 없는 종목입니다. 아래에서 영상으로 확인하세요.</div>';
  var yid = saved ? ytId(saved) : null;
  if(yid) html += '<div class="ytwrap"><iframe src="https://www.youtube.com/embed/'+yid+
    '" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>';
  else if(saved) html += '<a class="vlink main" href="'+esc(saved)+'" target="_blank" rel="noopener">▶ 저장해 둔 영상 보기</a>';
  html += '<div class="row" style="margin-bottom:10px">'+
    '<button class="btn ghost" id="gCnt">👆 횟수 세기</button>'+
    '<button class="btn ghost" id="gSw">⏱ 시간 재기</button></div>';
  html += '<a class="vlink'+(saved?'':' main')+'" href="https://www.youtube.com/results?search_query='+q+
          '" target="_blank" rel="noopener">▶ 유튜브에서 자세 영상 찾기</a>';
  html += '<div class="small muted" style="margin:14px 0 5px">마음에 드는 영상 주소를 붙여넣으면 다음부터 바로 열립니다'+
          (saved?' (지우고 저장하면 해제)':'')+'</div>'+
          '<input id="vIn" placeholder="https://youtu.be/..." value="'+esc(saved||'')+'">';
  var sh = sheet(name, html, function(){
    var v=$('#vIn').value.trim();
    if(v) D.vids[name]=v; else delete D.vids[name];
    save(); toast(v?'영상을 저장했습니다':'저장을 해제했습니다');
  }, '영상 저장', '닫기');
  sh.querySelector('#gCnt').onclick=function(){ counter(name, 0, null); };
  sh.querySelector('#gSw').onclick=function(){ stopwatch(name, null); };
}
function ytId(u){
  var m=String(u).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}

function renderWeight(){
  var o=day(cur), ch=$('#exChips'), used=Object.keys(o.w);
  ch.innerHTML='';
  D.exercises.forEach(function(n){
    var b=document.createElement('button');
    b.className='chip'+(used.indexOf(n)>=0?' on':'');
    b.textContent=n;
    var held=false, tm=null;
    function hold(){ tm=setTimeout(function(){ held=true; guide(n); },480); }
    function rel(){ clearTimeout(tm); }
    b.addEventListener('touchstart',hold,{passive:true});
    b.addEventListener('touchend',rel); b.addEventListener('touchmove',rel);
    b.addEventListener('mousedown',hold); b.addEventListener('mouseup',rel);
    b.addEventListener('mouseleave',rel);
    b.onclick=function(){ if(held){ held=false; return; } addSet(n); };
    ch.appendChild(b);
  });
  var L=$('#exList'), tot=0;
  L.innerHTML='';
  if(!used.length){
    L.innerHTML='<div class="empty">위에서 종목을 눌러 오늘의 첫 세트를 기록하세요<br>'+
      '어떤 운동인지 궁금하면 아래 <b>📖 운동 설명</b>을 누르세요</div>';
  }
  used.forEach(function(n){
    var sets=o.w[n]||[], vol=0;
    sets.forEach(function(s){ vol += (s.kg||0)*(s.rep||0); });
    tot+=vol;
    var c=document.createElement('div'); c.className='card';
    var h='<div class="row"><div class="grow" data-g="'+esc(n)+'" style="cursor:pointer">'+
      '<div class="exname">'+esc(n)+'</div>'+
      '<div class="prev">'+prevText(n)+' · 설명 보기 ›</div></div>'+
      '<button class="gbtn" data-g="'+esc(n)+'">설명 ▶</button>'+
      '<button class="btn ghost" style="width:auto;padding:9px 14px" data-add="'+esc(n)+'">＋ 세트</button></div>';
    sets.forEach(function(s,i){
      h+='<div class="setline"><span class="setno num">'+(i+1)+'</span>'+
         '<span class="setval num">'+s.kg+'<span class="small muted"> kg</span> × '+s.rep+'<span class="small muted"> 회</span></span>'+
         '<button class="del" data-d="'+esc(n)+'" data-i="'+i+'">×</button></div>';
    });
    var rm=0; sets.forEach(function(s){ var e=s.kg*(1+s.rep/30); if(e>rm) rm=e; });
    h+='<div class="volume num">볼륨 '+fmt(vol)+' kg · '+sets.length+'세트'+
       (rm? ' · 추정 1RM '+rm.toFixed(0)+'kg':'')+'</div>';
    c.innerHTML=h; L.appendChild(c);

  L.querySelectorAll('[data-add]').forEach(function(b){ b.onclick=function(){ addSet(b.dataset.add); }; });

  L.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){
    var n=b.dataset.d; o.w[n].splice(+b.dataset.i,1);
    if(!o.w[n].length) delete o.w[n]; save(); renderWeight();
  };});
  $('#volTotal').textContent = tot? ('오늘 총 볼륨 '+fmt(tot)+' kg') : '';
}

  var mx=0; s.forEach(function(x){ if(x.kg>mx) mx=x.kg; });

function calGoal(){
  var P=D.profile, w=weightOn(cur);
  if(!P||!w) return 0;
  var age=P.birth?(new Date().getFullYear()-P.birth):45;
  var bmr=10*w+6.25*P.height-5*age+(P.sex==='f'?-161:5);
  var tdee=bmr*(P.act||1.375), g=tdee;
  if(P.goal && P.goal < w-0.5) g=tdee-350;
  else if(P.goal && P.goal > w+0.5) g=tdee+300;
  var floor = P.sex==='f'?1200:1500;
  return Math.max(Math.round(g/10)*10, floor);
}

function streak(){

  var n=0, d=new Date(cur+'T12:00');

/* ══ 내 정보 · 분석 ══ */
var ACTS=[[1.2,'거의 안 움직임'],[1.375,'가벼운 활동 (주 1~3회)'],[1.55,'보통 활동 (주 3~5회)'],[1.725,'활발한 활동 (주 6~7회)']];

function weightOn(k){
  var ks=Object.keys(D.body).filter(function(x){ return x<=k; }).sort();
  if(ks.length) return D.body[ks[ks.length-1]].w;
  ks=Object.keys(D.body).sort();
  return ks.length ? D.body[ks[0]].w : 0;
}
function bmiLabel(v){
  if(v<18.5) return '저체중';
  if(v<23) return '정상';
  if(v<25) return '비만 전단계';
  if(v<30) return '1단계 비만';
  if(v<35) return '2단계 비만';
  return '3단계 비만';
}
function met(type,km,min){
  var sp = (km>0&&min>0) ? km/(min/60) : 0;
  if(type==='달리기'){ if(!sp) sp=9; return sp<8?8.3:sp<11?10:sp<13?11.8:14; }
  if(type==='걷기'){ if(!sp) sp=4.5; return sp<4?2.8:sp<5.5?3.5:sp<6.5?5:6.3; }
  if(type==='자전거'){ if(!sp) sp=16; return sp<16?4:sp<19?6.8:sp<22?8:10; }
  if(type==='등산') return 6.5;
  if(type==='수영') return 6.0;
  return 4.0;
}
function kcalOf(r,k){
  if(r.kcal) return r.kcal;
  var w=weightOn(k||cur); if(!w) return 0;
  return Math.round(met(r.type,r.km,r.min)*3.5*w/200*r.min);
}

        height:ht, goal:parseFloat($('#pG').value)||0, act:parseFloat($('#pA').value)||1.375 };

function renderProfile(){
  var P=D.profile, b=$('#profBox');
  if(!P){
    b.innerHTML='<div class="empty" style="margin-bottom:12px">키와 나이를 등록하면<br>BMI·표준체중·기초대사량이 계산됩니다</div>'+
      '<button class="btn" id="pBtn" style="margin-bottom:14px">내 정보 등록하기</button>';

function renderAnalysis(){
  var box=$('#analysis'), P=D.profile, w=weightOn(cur);
  if(!P){ box.innerHTML=''; return; }
  if(!w){ box.innerHTML='<div class="empty" style="margin-top:12px">체중을 한 번 기록하면<br>분석이 나옵니다</div>'; return; }
  var m=P.height/100, bmi=w/(m*m);
  var lo=(18.5*m*m), hi=(22.9*m*m);
  var age=P.birth? (new Date().getFullYear()-P.birth) : 45;
  var bmr = 10*w + 6.25*P.height - 5*age + (P.sex==='f'? -161 : 5);
  var tdee = bmr*(P.act||1.375);
  var b=D.body[cur]||{};
  var rows='<div class="h">몸 상태</div>'+
    '<div class="r"><span>체질량지수 BMI</span><b>'+bmi.toFixed(1)+'<span class="badge">'+bmiLabel(bmi)+'</span></b></div>'+
    '<div class="r"><span>키 기준 정상 체중</span><b class="num">'+lo.toFixed(1)+' ~ '+hi.toFixed(1)+' kg</b></div>';
  if(P.goal){
    var d=w-P.goal;
    rows+='<div class="r"><span>목표까지</span><b class="num">'+(Math.abs(d)<0.1?'도달':(d>0?d.toFixed(1)+' kg 감량':Math.abs(d).toFixed(1)+' kg 증량'))+'</b></div>';
  }
  if(b.m) rows+='<div class="r"><span>골격근량 비율</span><b class="num">'+(b.m/w*100).toFixed(1)+' %</b></div>';
  rows+='<div class="h">하루 칼로리 (추정)</div>'+
    '<div class="r"><span>기초대사량</span><b class="num">'+fmt(bmr)+' kcal</b></div>'+
    '<div class="r"><span>활동 포함 유지 칼로리</span><b class="num">'+fmt(tdee)+' kcal</b></div>';

  var mo=cur.slice(0,7), kc=0, cmin=0, vol=0, dcnt=0;
  Object.keys(D.days).forEach(function(k){
    if(k.slice(0,7)!==mo) return;
    var o=D.days[k], any=false;
    (o.c||[]).forEach(function(r){ kc+=kcalOf(r,k); cmin+=r.min; any=true; });
    Object.keys(o.w||{}).forEach(function(n){ (o.w[n]||[]).forEach(function(s){ vol+=(s.kg||0)*(s.rep||0); any=true; }); });
    if(Object.keys(o.r||{}).length) any=true;
    if(any) dcnt++;
  });
  rows+='<div class="h">이번 달 운동</div>'+
    '<div class="r"><span>운동한 날</span><b class="num">'+dcnt+' 일</b></div>'+
    '<div class="r"><span>유산소</span><b class="num">'+cmin+' 분 · 약 '+fmt(kc)+' kcal</b></div>'+
    '<div class="r"><span>웨이트 총 볼륨</span><b class="num">'+fmt(vol)+' kg</b></div>';
  if(vol>0) rows+='<div class="r"><span>체중 대비 볼륨</span><b class="num">'+(vol/w).toFixed(0)+' 배</b></div>';

  box.innerHTML='<div class="an">'+rows+'</div>'+
    '<div class="small muted" style="padding:10px 4px 0;line-height:1.6">칼로리와 BMI는 통계식으로 계산한 어림값입니다. 몸 상태 판단은 건강검진 결과를 기준으로 하세요.</div>';
}

function drawChart(){
  var ks=Object.keys(D.body).sort().slice(-30);
  var svg=$('#wChart'), W=320, H=150, P=20;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if(ks.length<2){
    svg.innerHTML='<text x="'+(W/2)+'" y="'+(H/2)+'" style="fill:var(--muted)" font-size="12" text-anchor="middle">기록이 2개 이상 쌓이면 그래프가 나옵니다</text>';
    $('#chartFrom').textContent=''; $('#chartTo').textContent=''; return;
  }
  var vs=ks.map(function(k){return D.body[k].w;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mx-mn<1){ mn-=.5; mx+=.5; }
  var pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  var pts=vs.map(function(v,i){
    var x=P+(W-P*2)*(ks.length===1?.5:i/(ks.length-1));
    var y=P+(H-P*2)*(1-(v-mn)/(mx-mn));
    return [x,y];
  });
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(H-P)+' L'+line.split(' ').join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-P)+' Z';
  var lastP=pts[pts.length-1];
  svg.innerHTML=
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" style="stop-color:var(--body);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--body);stop-opacity:0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<polyline points="'+line+'" fill="none" style="stroke:var(--body)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lastP[0].toFixed(1)+'" cy="'+lastP[1].toFixed(1)+'" r="4" style="fill:var(--body)"/>'+
    '<text x="'+(lastP[0]-6).toFixed(1)+'" y="'+(lastP[1]-9).toFixed(1)+'" style="fill:var(--text)" font-size="12" font-weight="700" text-anchor="end">'+vs[vs.length-1]+'</text>';
  $('#chartFrom').textContent=ks[0].slice(5).replace('-','/');
  var diff=(vs[vs.length-1]-vs[0]).toFixed(1);
  $('#chartTo').textContent=(diff>0?'+':'')+diff+'kg';
}

function renderLog(){
  var mo=cur.slice(0,7), days=0, vol=0;
  Object.keys(D.days).forEach(function(k){
    if(k.slice(0,7)!==mo) return;
    var o=D.days[k];
    if(summary(o).length) days++;
    Object.keys(o.w||{}).forEach(function(n){ (o.w[n]||[]).forEach(function(s){ vol+=(s.kg||0)*(s.rep||0); }); });
  });
  $('#lDays').textContent=days;
  $('#lVol').textContent=(vol/1000).toFixed(1);
  var L=$('#logList'); L.innerHTML='';
  var ks=Object.keys(D.days).sort().reverse().filter(function(k){ return summary(D.days[k]).length; }).slice(0,40);
  if(!ks.length){ L.innerHTML='<div class="empty">아직 기록이 없습니다</div>'; renderSync(); return; }
  ks.forEach(function(k){
    var d=new Date(k+'T12:00');
    var el=document.createElement('div'); el.className='logday';
    el.innerHTML='<div class="d">'+(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')</div>'+
      summary(D.days[k]).map(function(s){return '<div class="l">'+esc(s)+'</div>'}).join('')+
      (D.body[k]?'<div class="l num">체중 '+D.body[k].w+'kg</div>':'');
    el.onclick=function(){ setDate(k); };
    L.appendChild(el);
  });
  renderSync();
}
function summary(o){
  var out=[];
  var ws=Object.keys(o.w||{});
  if(ws.length){
    var v=0,st=0; ws.forEach(function(n){ (o.w[n]||[]).forEach(function(s){ v+=(s.kg||0)*(s.rep||0); st++; }); });
    out.push('웨이트 '+ws.length+'종목 '+st+'세트 · '+fmt(v)+'kg');
  }
  (o.c||[]).forEach(function(r){ out.push(r.type+' '+r.min+'분'+(r.km?' '+r.km+'km':'')); });
  if(o.steps) out.push('걸음 '+fmt(o.steps)+'보');
  var rd=Object.keys(o.r||{}).length;
  if(rd) out.push('홈트 '+rd+'개 완료');
  var fk=0; (o.f||[]).forEach(function(x){ fk+=x.k||0; });
  if(fk) out.push('식사 '+(o.f.length)+'건 · '+fmt(fk)+'kcal');
  return out;
}
